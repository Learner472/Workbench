function Testing({ data, pairsEnriched, modelsById, suppliersById, compressorsById, expandedPair, setExpandedPair, testingFilter = "all", onClearTestingFilter, addPair, addAttempt, deletePair, updatePairStatus, updateAttempt }) {
  const [addOpen, setAddOpen] = useState(false);
  const [newPairId, setNewPairId] = useState("");
  const [newModel, setNewModel] = useState(data.models[0]?.id || "");
  const [newSupplier, setNewSupplier] = useState(data.suppliers[0]?.id || "");
  const [newCompressor, setNewCompressor] = useState(data.compressors[0]?.id || "");
  const [newDepartment, setNewDepartment] = useState("Development");
  const [newPairNote, setNewPairNote] = useState("");
  const [newTargetDate, setNewTargetDate] = useState("");
  const [newPlanningNote, setNewPlanningNote] = useState("");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("newest");

  const filterLabels = { all: "All pairs", "pulldown-pass": "Pull-Down passed", "thermostat-pass": "Thermostat passed", "awaiting-quality": "Awaiting Quality", approved: "Approved", rejected: "Rejected / Rework", mixed: "Mixed outcome" };

  const visiblePairs = useMemo(() => {
    const q = search.trim().toLowerCase();
    const filtered = pairsEnriched.filter(p => {
      const filterMatch = testingFilter === "all" ||
        (testingFilter === "pulldown-pass" && p.pullDownStatus === "Pass") ||
        (testingFilter === "thermostat-pass" && p.thermostatStatus === "Pass") ||
        (testingFilter === "awaiting-quality" && p.qualityStatus === "Submitted to Quality") ||
        (testingFilter === "approved" && p.qualityStatus === "Approved") ||
        (testingFilter === "rejected" && (p.qualityStatus === "Rejected" || p.qualityStatus === "Rework Requested")) ||
        (testingFilter === "mixed" && p.outcome === "Mixed");
      if (!filterMatch) return false;
      if (!q) return true;
      const haystack = [
        p.id, p.department, p.qualityStatus, p.outcome, p.note, p.planningNote, p.targetDate,
        modelsById[p.modelId]?.name, p.modelId,
        suppliersById[p.supplierId]?.name, p.supplierId,
        compressorsById[p.compressorId]?.id, compressorsById[p.compressorId]?.spec
      ].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    });
    return [...filtered].sort((a,b) => {
      switch (sortBy) {
        case "oldest": return String(a.dateAdded).localeCompare(String(b.dateAdded)) || a.id.localeCompare(b.id);
        case "id": return a.id.localeCompare(b.id);
        case "model": return (modelsById[a.modelId]?.name || "").localeCompare(modelsById[b.modelId]?.name || "") || a.id.localeCompare(b.id);
        case "supplier": return (suppliersById[a.supplierId]?.name || "").localeCompare(suppliersById[b.supplierId]?.name || "") || a.id.localeCompare(b.id);
        case "department": return (a.department || "").localeCompare(b.department || "") || a.id.localeCompare(b.id);
        case "status": return (a.qualityStatus || "").localeCompare(b.qualityStatus || "") || a.id.localeCompare(b.id);
        case "outcome": return (a.outcome || "").localeCompare(b.outcome || "") || a.id.localeCompare(b.id);
        case "newest":
        default: return String(b.dateAdded).localeCompare(String(a.dateAdded)) || b.id.localeCompare(a.id);
      }
    });
  }, [pairsEnriched, search, sortBy, testingFilter, modelsById, suppliersById, compressorsById]);

  const submitNewPair = () => {
    const pairId = String(newPairId || "").trim();
    if (!pairId || !newModel || !newSupplier || !newCompressor || !newDepartment) {
      alert("Pair ID, Model, Supplier, Compressor Lot and Department are required.");
      return;
    }
    const created = addPair(pairId, newModel, newSupplier, newCompressor, newDepartment, newPairNote, newTargetDate, newPlanningNote);
    if (created !== false) {
      setAddOpen(false);
      setNewPairId("");
      setNewDepartment("Development");
      setNewPairNote(""); setNewTargetDate(""); setNewPlanningNote("");
    }
  };

  return (
    <div className="space-y-4">
      <div className="testing-toolbar">
        <div className="testing-toolbar__top">
          <div>
            <Eyebrow>Pairs &amp; Testing</Eyebrow>
            <div className="text-xs text-slate-500 mt-1">Search, sort and open a pair to record Pull-Down and Thermostat results.</div>
          </div>
          <Btn onClick={() => { setNewPairId(""); setAddOpen(true); }}><Icon name="plus" size={14}/> Add Pair</Btn>
        </div>
        <div className="testing-controls">
          <label className="search-box">
            <Icon name="search" size={14} className="text-slate-500" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search pair, model, supplier, compressor, department..." />
            {search && <button type="button" className="search-clear" onClick={() => setSearch("")} aria-label="Clear search">×</button>}
          </label>
          <Field label="Sort by">
            <select className={inputCls} value={sortBy} onChange={e => setSortBy(e.target.value)}>
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="id">Pair ID A–Z</option>
              <option value="model">Model A–Z</option>
              <option value="supplier">Supplier A–Z</option>
              <option value="department">Department</option>
              <option value="status">Status</option>
              <option value="outcome">Outcome</option>
            </select>
          </Field>
          <div className="results-count"><b>{visiblePairs.length}</b> of {pairsEnriched.length} pair{pairsEnriched.length === 1 ? "" : "s"}</div>
        </div>
        {testingFilter !== "all" && (
          <div className="mt-3 flex items-center gap-2">
            <span className="text-[11px] uppercase tracking-wider text-slate-500">Dashboard filter</span>
            <span className="inline-flex items-center gap-2 rounded-full bg-sky-50 border border-sky-200 px-3 py-1 text-xs font-medium text-sky-700">{filterLabels[testingFilter]}
              <button type="button" onClick={onClearTestingFilter} className="text-sky-500 hover:text-sky-800" title="Clear dashboard filter">×</button>
            </span>
          </div>
        )}
      </div>

      {visiblePairs.length === 0 && (
        <div className="text-sm text-slate-500 border border-dashed border-slate-800 rounded-sm p-6 text-center">
          {pairsEnriched.length === 0 ? "No pairs yet — click Add Pair to register one." : "No pairs match your search."}
        </div>
      )}

      <div className="space-y-2">
        {visiblePairs.map(p => (
          <PairRow key={p.id} pair={p} model={modelsById[p.modelId]} supplier={suppliersById[p.supplierId]} compressor={compressorsById[p.compressorId]}
            expanded={expandedPair === p.id} onToggle={() => setExpandedPair(expandedPair === p.id ? null : p.id)}
            addAttempt={addAttempt} deletePair={deletePair} updatePairStatus={updatePairStatus} updateAttempt={updateAttempt} />
        ))}
      </div>

      {addOpen && (
        <div className="modal-backdrop" onMouseDown={e => { if (e.target === e.currentTarget) setAddOpen(false); }}>
          <div className="add-pair-modal" role="dialog" aria-modal="true" aria-labelledby="add-pair-title">
            <div className="add-pair-modal__header">
              <div>
                <div id="add-pair-title" className="text-base font-semibold text-slate-100">Add New Pair</div>
                <div className="text-xs text-slate-500 mt-0.5">Select the unit, supplier, compressor and owning department.</div>
              </div>
              <button type="button" className="modal-close" onClick={() => setAddOpen(false)} aria-label="Close">×</button>
            </div>
            <div className="add-pair-modal__body">
              <div className="add-pair-grid">
                <Field label="Pair ID *">
                  <input className={inputCls} value={newPairId} onChange={e => setNewPairId(e.target.value)} placeholder="e.g. P-001 / RF120-001" />
                </Field>
                <Field label="Model *">
                  <select className={inputCls} value={newModel} onChange={e => setNewModel(e.target.value)}>{data.models.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select>
                </Field>
                <Field label="Supplier *">
                  <select className={inputCls} value={newSupplier} onChange={e => setNewSupplier(e.target.value)}>{data.suppliers.map(s => <option key={s.id} value={s.id}>{s.id} — {s.name}</option>)}</select>
                </Field>
                <Field label="Compressor Lot *">
                  <select className={inputCls} value={newCompressor} onChange={e => setNewCompressor(e.target.value)}>{data.compressors.map(c => <option key={c.id} value={c.id}>{c.id} — {c.spec}</option>)}</select>
                </Field>
                <Field label="Department *">
                  <select className={inputCls} value={newDepartment} onChange={e => setNewDepartment(e.target.value)}>
                    <option value="Development">Development</option>
                    <option value="Quality">Quality</option>
                  </select>
                </Field>
                <Field label="Target Test Date">
                  <input className={inputCls} type="date" value={newTargetDate} onChange={e => setNewTargetDate(e.target.value)} />
                </Field>
              </div>
              <div className="mt-3">
                <Field label="Pair Note">
                  <textarea className={inputCls + " w-full min-h-[80px]"} value={newPairNote} onChange={e => setNewPairNote(e.target.value)}
                    placeholder="Why is this pair being created? What should the tester or Quality team keep in mind?" />
                </Field>
              </div>
              <div className="mt-3">
                <Field label="Planning Note (what to do when the target date arrives)">
                  <textarea className={inputCls + " w-full min-h-[80px]"} value={newPlanningNote} onChange={e => setNewPlanningNote(e.target.value)}
                    placeholder="e.g. Run 24h load test with 73g R600a; check suction and discharge temperatures." />
                </Field>
              </div>
              <div className="add-pair-preview">
                <div className="text-[10px] uppercase tracking-wider text-slate-500">Pair preview</div>
                <div className="font-mono text-sm text-slate-200 mt-1">{newPairId || "—"}</div>
                <Pill className={newDepartment === "Quality" ? "text-amber-300 bg-amber-950/40 border-amber-700" : "text-sky-300 bg-sky-950/40 border-sky-700"}>{newDepartment}</Pill>
              </div>
            </div>
            <div className="add-pair-modal__footer">
              <Btn variant="ghost" onClick={() => setAddOpen(false)}>Cancel</Btn>
              <Btn onClick={submitNewPair}><Icon name="plus" size={14}/> Add Pair</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PairRow({ pair, model, supplier, compressor, expanded, onToggle, addAttempt, deletePair, updatePairStatus, updateAttempt }) {
  const [pdMeasured, setPdMeasured] = useState("");
  const [pdRef35, setPdRef35] = useState("");
  const [pdFreezer35, setPdFreezer35] = useState("");
  const [pdSuction35, setPdSuction35] = useState("");
  const [pdRef24, setPdRef24] = useState("");
  const [pdFreezer24, setPdFreezer24] = useState("");
  const [pdSuction24, setPdSuction24] = useState("");
  const [pdGasCharge, setPdGasCharge] = useState("");
  const [pdTestId, setPdTestId] = useState("");
  const [pdTester, setPdTester] = useState("");
  const [pdNotes, setPdNotes] = useState("");
  const [showPdForm, setShowPdForm] = useState(false);
  const [editingPdId, setEditingPdId] = useState(null);

  const [thTestId, setThTestId] = useState("");
  const [thTester, setThTester] = useState("");
  const [thNotes, setThNotes] = useState("");
  const [showThForm, setShowThForm] = useState(false);
  const [editingThId, setEditingThId] = useState(null);
  const [thGasCharge, setThGasCharge] = useState("");
  const emptyThMeasured = () => ({
    min: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    p3: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    p5: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    mid: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    max: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
  });
  const [thPos, setThPos] = useState(emptyThMeasured());

  const setPosition = (key, group, field, value) => setThPos(prev => ({
    ...prev, [key]: { ...prev[key], [group]: { ...prev[key][group], [field]: value } }
  }));

  const submitPd = () => {
    if (pdGasCharge === "") {
      alert("Current gas charge is required before logging the Pull-Down test.");
      return;
    }
    if ([pdRef35, pdFreezer35, pdRef24, pdFreezer24].some(v => v === "")) {
      alert("Enter separate Refrigerator and Freezer temperatures for both 3.5 hours (Pull-Down) and 24 hours (Load).");
      return;
    }
    const patch = {
      testId: pdTestId.trim(), measured: pdMeasured === "" ? "" : Number(pdMeasured),
      at3_5h: { ref: Number(pdRef35), freezer: Number(pdFreezer35), suction: pdSuction35 === "" ? "" : Number(pdSuction35) },
      at24h: { ref: Number(pdRef24), freezer: Number(pdFreezer24), suction: pdSuction24 === "" ? "" : Number(pdSuction24) },
      gasCharge: Number(pdGasCharge), tester: pdTester || "—", notes: pdNotes.trim()
    };
    if (editingPdId) updateAttempt(pair.id, "pulldown", editingPdId, patch);
    else addAttempt(pair.id, "pulldown", { id: uid("a"), date: new Date().toISOString().slice(0, 10), loggedAt: new Date().toISOString(), ...patch });
    setPdMeasured(""); setPdRef35(""); setPdFreezer35(""); setPdSuction35(""); setPdRef24(""); setPdFreezer24(""); setPdSuction24(""); setPdGasCharge(""); setPdTestId(""); setPdTester(""); setPdNotes("");
    setEditingPdId(null); setShowPdForm(false);
  };

  const submitTh = () => {
    if (thGasCharge === "") {
      alert("Current gas charge is required before logging the Thermostat test.");
      return;
    }
    const thermoDefs = getThermoPositionDefs(model);
    const complete = thermoDefs.every(([key]) => {
      const p = thPos[key];
      return p && p.cutIn.ref !== "" && p.cutIn.freezer !== "" && p.cutOut.ref !== "" && p.cutOut.freezer !== "";
    });
    if (!complete) return;

    const positions = {};
    thermoDefs.forEach(([key]) => {
      const p = thPos[key];
      positions[key] = {
        cutIn: { ref: Number(p.cutIn.ref), freezer: Number(p.cutIn.freezer) },
        cutOut: { ref: Number(p.cutOut.ref), freezer: Number(p.cutOut.freezer) }
      };
    });

    const patch = {
      testId: thTestId.trim(),
      positions,
      gasCharge: Number(thGasCharge),
      tester: thTester || "—",
      notes: thNotes.trim()
    };
    if (editingThId) updateAttempt(pair.id, "thermostat", editingThId, patch);
    else addAttempt(pair.id, "thermostat", { id: uid("a"), date: new Date().toISOString().slice(0, 10), loggedAt: new Date().toISOString(), ...patch });
    setThPos(emptyThMeasured()); setThGasCharge(""); setThTestId(""); setThTester(""); setThNotes("");
    setEditingThId(null); setShowThForm(false);
  };

  const startEditPd = (a) => {
    setEditingPdId(a.id); setPdTestId(a.testId || ""); setPdGasCharge(a.gasCharge ?? ""); setPdMeasured(a.measured ?? "");
    setPdRef35(a.at3_5h?.ref ?? a.at3_5h?.Tr ?? ""); setPdFreezer35(a.at3_5h?.freezer ?? a.at3_5h?.Tf ?? ""); setPdSuction35(a.at3_5h?.suction ?? "");
    setPdRef24(a.at24h?.ref ?? a.at24h?.Tr ?? ""); setPdFreezer24(a.at24h?.freezer ?? a.at24h?.Tf ?? ""); setPdSuction24(a.at24h?.suction ?? "");
    setPdTester(a.tester || ""); setPdNotes(a.notes || ""); setShowPdForm(true); setShowThForm(false);
  };
  const startEditTh = (a) => {
    setEditingThId(a.id); setThTestId(a.testId || ""); setThGasCharge(a.gasCharge ?? ""); setThTester(a.tester || ""); setThNotes(a.notes || "");
    const e = emptyThMeasured();
    if (a.positions) Object.keys(e).forEach(k => { e[k] = { cutIn: { ref: a.positions[k]?.cutIn?.ref ?? "", freezer: a.positions[k]?.cutIn?.freezer ?? "" }, cutOut: { ref: a.positions[k]?.cutOut?.ref ?? "", freezer: a.positions[k]?.cutOut?.freezer ?? "" } }; });
    setThPos(e); setShowThForm(true); setShowPdForm(false);
  };

  const submitQuality = () => updatePairStatus(pair.id, { qualityStatus: "Submitted to Quality", submittedDate: new Date().toISOString().slice(0, 10) });

  const fmtDateTime = (value, fallback = "—") => {
    if (!value) return fallback;
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString([], {year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit"});
  };
  const printTestLogs = (kind) => {
    const attempts = kind === "pulldown" ? (pair.pullDownAttempts || []) : (pair.thermostatAttempts || []);
    const title = kind === "pulldown" ? "Pull-Down Test Log" : "Thermostat Test Log";
    const modelName = model?.name || "—";
    const ref = kind === "pulldown" ? (model?.referencePullDown || {}) : (model?.referenceThermostat || {});
    const referenceGasType = model?.referenceGasType || ref.gasType || "—";
    const referenceGasCharge = model?.referenceGasCharge ?? ref.gasCharge ?? "—";
    const refTemps = kind === "pulldown"
      ? `Pull-Down ${model?.pullDownTemps?.ref ?? "—"}°C Ref / ${model?.pullDownTemps?.freezer ?? "—"}°C Frz · Load ${model?.loadTemps?.ref ?? "—"}°C Ref / ${model?.loadTemps?.freezer ?? "—"}°C Frz`
      : getThermoPositionDefs(model).map(([key,label]) => { const t=thermoTargetFor(model,key)||{}; return `${label}: Ref In/Out ${t.cutIn?.ref ?? "—"}/${t.cutOut?.ref ?? "—"}°C · Frz In/Out ${t.cutIn?.freezer ?? "—"}/${t.cutOut?.freezer ?? "—"}°C`; }).join(" · ");
    const referenceRow = `<tr class="reference-row"><td colspan="${kind === "pulldown" ? 15 : 10}"><b>MODEL REFERENCE</b> · Test Report ID: <b>${ref.testId || "—"}</b> · Gas: <b>${referenceGasType}</b> · Reference Charge: <b>${referenceGasCharge} g</b> · ${refTemps} · Compressor: <b>${compressor?.id || compressor?.spec || "—"}</b> · Type: <b>${model?.compressorType || compressor?.type || "—"}</b> · Why Standard: ${model?.standardNote || "—"}</td></tr>`;
    const rows = attempts.map((a, i) => {
      if (kind === "pulldown") {
        const t35 = a.at3_5h || {}; const t24 = a.at24h || {};
        const ref35 = model?.pullDownTemps?.ref ?? "—", frz35 = model?.pullDownTemps?.freezer ?? "—";
        const ref24 = model?.loadTemps?.ref ?? "—", frz24 = model?.loadTemps?.freezer ?? "—";
        return `<tr><td>${i+1}</td><td>${a.testId || "—"}</td><td>${a.gasCharge ?? "—"} g</td><td>${a.measured ?? "—"} min</td><td>${t35.ref ?? t35.Tr ?? "—"}°C</td><td>${t35.freezer ?? t35.Tf ?? "—"}°C</td><td>${t35.suction ?? "—"}°C</td><td>${ref35}°C / ${frz35}°C</td><td>${t24.ref ?? t24.Tr ?? "—"}°C</td><td>${t24.freezer ?? t24.Tf ?? "—"}°C</td><td>${t24.suction ?? "—"}°C</td><td>${ref24}°C / ${frz24}°C</td><td>${a.tester || "—"}</td><td>${fmtDateTime(a.loggedAt, a.date)}</td><td>${a.editedAt ? fmtDateTime(a.editedAt) : "—"}</td></tr>`;
      }
      return `<tr><td>${i+1}</td><td>${a.testId || "—"}</td><td>${a.gasCharge ?? "—"} g</td><td colspan="4">${getThermoPositionDefs(model).map(([key,label]) => { const p=a.positions?.[key]||{}; const t=thermoTargetFor(model,key)||{}; return `<b>${label}</b>: Ref In ${p.cutIn?.ref ?? "—"} / Out ${p.cutOut?.ref ?? "—"}°C; Frz In ${p.cutIn?.freezer ?? "—"} / Out ${p.cutOut?.freezer ?? "—"}°C<br><span class="muted">Target Ref ${t.cutIn?.ref ?? "—"}/${t.cutOut?.ref ?? "—"}°C · Frz ${t.cutIn?.freezer ?? "—"}/${t.cutOut?.freezer ?? "—"}°C</span>`; }).join("<hr>")}</td><td>${a.tester || "—"}</td><td>${fmtDateTime(a.loggedAt, a.date)}</td><td>${a.editedAt ? fmtDateTime(a.editedAt) : "—"}</td></tr>`;
    }).join("");
    const head = kind === "pulldown" ? `<tr><th>#</th><th>Test ID</th><th>Gas Charge</th><th>PD Time</th><th>3.5h Ref</th><th>3.5h Frz</th><th>3.5h Suction</th><th>3.5h Target Ref / Frz</th><th>24h Ref</th><th>24h Frz</th><th>24h Suction</th><th>24h Target Ref / Frz</th><th>Tester</th><th>Logged</th><th>Edited</th></tr>` : `<tr><th>#</th><th>Test ID</th><th>Gas Charge</th><th colspan="4">Measured + Model Reference (Ref / Frz)</th><th>Tester</th><th>Logged</th><th>Edited</th></tr>`;
    const win = window.open("", "_blank", "width=1400,height=900");
    if (!win) { alert("Please allow pop-ups to print the test log."); return; }
    win.document.write(`<!doctype html><html><head><title>${title} - ${pair.id}</title><style>body{font-family:Arial,sans-serif;color:#172033;margin:24px;font-size:11px}h1{font-size:20px;margin:0 0 4px}h2{font-size:12px;color:#64748b;margin:0 0 16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:6px;vertical-align:top;text-align:left}th{background:#f1f5f9;font-size:9px;text-transform:uppercase}td{font-size:10px}.reference-row td{background:#ecfdf5;border:1px solid #99f6e4;font-size:10px;line-height:1.45}.muted{color:#64748b;font-size:9px}hr{border:0;border-top:1px solid #e2e8f0;margin:5px 0}@page{size:landscape;margin:10mm}@media print{body{margin:0}}</style></head><body><h1>${title}</h1><h2>Pair ${pair.id} · Model ${modelName} · Supplier ${supplier?.name || "—"} · Compressor ${compressor?.id || compressor?.spec || "—"}</h2><table><thead>${head}</thead><tbody>${referenceRow}${rows || '<tr><td colspan="15">No records logged.</td></tr>'}</tbody></table></body></html>`);
    win.document.close(); win.focus(); setTimeout(() => { win.print(); }, 250);
  };

  const pdDisplay = a => {
    const t35 = a.at3_5h ? `3.5h Ref ${a.at3_5h.ref ?? a.at3_5h.Tr ?? "—"}° / Freezer ${a.at3_5h.freezer ?? a.at3_5h.Tf ?? "—"}° / Suc ${a.at3_5h.suction ?? "—"}°` : "3.5h —";
    const t24 = a.at24h ? `24h Ref ${a.at24h.ref ?? a.at24h.Tr ?? "—"}° / Freezer ${a.at24h.freezer ?? a.at24h.Tf ?? "—"}° / Suc ${a.at24h.suction ?? "—"}°` : "24h —";
    const charge = a.gasCharge !== undefined && a.gasCharge !== "" ? `${a.gasCharge} g` : "—";
    const testId = a.testId || "—";
    const targets = model?.pullDownTemps && model?.loadTemps ? `Targets: 3.5h Ref ${model.pullDownTemps.ref}° / Freezer ${model.pullDownTemps.freezer}° · 24h Ref ${model.loadTemps.ref}° / Freezer ${model.loadTemps.freezer}°` : "";
    return <div className="log-row__main"><div className="log-row__value">{a.measured !== "" && a.measured !== undefined ? `${a.measured} min · ` : ""}{t35} · {t24}</div>{targets && <div className="log-row__note"><b>Model targets:</b> {targets}</div>}<div className="log-row__meta"><span>Test ID: <b>{testId}</b></span><span>Charge: <b className="text-amber-300">{charge}</b></span><span>Tester: {a.tester}</span><span>Logged: {fmtDateTime(a.loggedAt, a.date)}</span>{a.editedAt && <span>Edited: {fmtDateTime(a.editedAt)}</span>}</div><div className="log-row__note"><b>Note:</b> {a.notes || "No note added."}</div></div>;
  };

  const thDisplay = a => {
    if (a.positions) return (
      <div className="log-row__main">
        <div className="thermo-log-comparison">
          {getThermoPositionDefs(model).map(([key,label]) => {
            const measured = a.positions[key];
            const target = thermoTargetFor(model, key);
            const result = thermoPositionStatus(model, a, key);
            return (
              <div className="thermo-log-position" key={key}>
                <div className="thermo-log-position__name">{label}</div>
                <div className="thermo-log-position__reading">{measured?.cutIn?.ref !== undefined ? <>Ref In {measured.cutIn.ref}° · Freezer In {measured.cutIn.freezer}°<br/>Ref Out {measured.cutOut.ref}° · Freezer Out {measured.cutOut.freezer}°</> : `Actual In ${measured.cutIn}° / Out ${measured.cutOut}°`}</div>
                <div className="thermo-log-position__target">{target?.cutIn?.ref !== undefined ? `Target Ref In/Out ${target.cutIn.ref}/${target.cutOut.ref}° · Freezer In/Out ${target.cutIn.freezer}/${target.cutOut.freezer}° ± ${model.thermoTolerance}°` : "Target not configured"}</div>
                {result && <span className={`thermo-log-result ${result === "Pass" ? "pass" : "fail"}`}>{result}</span>}
              </div>
            );
          })}
        </div>
        <div className="log-row__meta"><span>Test ID: <b>{a.testId || "—"}</b></span><span>Charge: <b className="text-amber-300">{a.gasCharge !== undefined && a.gasCharge !== "" ? `${a.gasCharge} g` : "—"}</b></span><span>Tester: {a.tester}</span><span>Logged: {fmtDateTime(a.loggedAt, a.date)}</span>{a.editedAt && <span>Edited: {fmtDateTime(a.editedAt)}</span>}</div>
        <div className="log-row__note"><b>Note:</b> {a.notes || "No note added."}</div>
      </div>
    );
    return <div className="log-row__main"><div className="log-row__value">in {a.cutIn}° / out {a.cutOut}°</div><div className="log-row__meta"><span>Test ID: <b>{a.testId || "—"}</b></span><span>Charge: <b className="text-amber-300">{a.gasCharge !== undefined && a.gasCharge !== "" ? `${a.gasCharge} g` : "—"}</b></span><span>Tester: {a.tester}</span><span>Logged: {fmtDateTime(a.loggedAt, a.date)}</span>{a.editedAt && <span>Edited: {fmtDateTime(a.editedAt)}</span>}</div><div className="log-row__note"><b>Note:</b> {a.notes || "No note added."}</div></div>;
  };

  const pdReady = pdGasCharge !== "" && [pdRef35,pdFreezer35,pdRef24,pdFreezer24].every(v => v !== "");
  const thReady = thGasCharge !== "" && getThermoPositionDefs(model).every(([key]) => {
    const p = thPos[key];
    return p && p.cutIn.ref !== "" && p.cutIn.freezer !== "" && p.cutOut.ref !== "" && p.cutOut.freezer !== "";
  });

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-sm overflow-hidden">
      <button onClick={onToggle} className="w-full flex items-center justify-between px-4 py-3 hover:bg-slate-850 text-left">
        <div className="flex items-center gap-3">
          <Icon name={expanded ? "chevronDown" : "chevronRight"} size={16} className="text-slate-500" />
          <div className="min-w-0">
            <div className="text-sm font-mono text-slate-200">{pair.id}</div>
            <div className="text-xs text-slate-500">{model?.name} · {supplier?.name} · {compressor?.spec}</div>
            <div className="mt-1 flex items-center gap-2 flex-wrap">
              <Pill className={pair.department === "Quality" ? "text-amber-300 bg-amber-950/40 border-amber-700" : "text-sky-300 bg-sky-950/40 border-sky-700"}>{pair.department || "Development"}</Pill>
            </div>
            {pair.note && <div className="pair-header-note"><b>Pair note:</b> {pair.note}</div>}
          </div>
        </div>
        <div className="flex items-center gap-4"><GaugeBadge status={pair.pullDownStatus} label="Pull-Down" /><GaugeBadge status={pair.thermostatStatus} label="Thermostat" /><Pill className={qStatusColor[pair.qualityStatus]}>{pair.qualityStatus}</Pill></div>
      </button>
      {expanded && (

                  </div>
                  <AttemptHistory attempts={pair.thermostatAttempts} render={a => thDisplay(a)} onEdit={startEditTh} />
                </div>
                {showThForm && <div className="test-entry-form">
                  <div className="test-entry-form__header"><div><div className="test-entry-form__title">{editingThId ? "Edit Thermostat Test" : "Add Thermostat Test"}</div><div className="test-entry-form__subtitle">Record Cut-In / Cut-Out at all {getThermoPositionDefs(model).length} thermostat positions for this {model?.category || "model"}.</div></div><button type="button" className="test-entry-form__close" onClick={() => setShowThForm(false)} aria-label="Close Thermostat form">×</button></div>
                  <div className="thermo-reference"><b>Model thermostat targets:</b>{" "}{model && hasThermoPositionTargets(model) ? getThermoPositionDefs(model).map(([key,label]) => { const t = model.thermoPositions[key]; return `${label} Ref In/Out ${t.cutIn.ref}/${t.cutOut.ref}° · Freezer In/Out ${t.cutIn.freezer}/${t.cutOut.freezer}°`; }).join(" · ") + ` · ± ${model.thermoTolerance}°` : "Thermostat position targets are not configured for this model."}</div>
                  <div className="entry-requirements"><span className="req-icon">!</span><span><strong>* Current gas charge is mandatory.</strong> Enter the actual charge present in the unit before logging this Thermostat record.</span></div>
                  <div className="measurement-block test-id-card"><Field label="Test ID"><input className={inputCls} value={thTestId} onChange={e=>setThTestId(e.target.value)} placeholder="e.g. TH-2026-001" /></Field></div>
                  <div className="gas-charge-card"><Field label={<span>Current Gas Charge (g) <span className="required-mark">*</span></span>}><input className={inputCls} required type="number" min="0" step="0.1" value={thGasCharge} onChange={e=>setThGasCharge(e.target.value)} placeholder="e.g. 45" /><div className="gas-copy">Required for every Thermostat log</div></Field><div className="gas-unit">GRAMS (g)</div></div>
                  <div className="position-grid">{getThermoPositionDefs(model).map(([key,label]) => (<div key={key} className="position-card"><div className="position-card__title"><span>{label}</span><span className="position-card__target">{(() => { const t = thermoTargetFor(model, key); return t?.cutIn?.ref !== undefined ? `Ref In/Out ${t.cutIn.ref}/${t.cutOut.ref}° · Freezer In/Out ${t.cutIn.freezer}/${t.cutOut.freezer}° ± ${model.thermoTolerance}°` : "Target not set"; })()}</span></div><div className="thermo-measurement-grid"><div className="thermo-measurement-group"><div className="thermo-measurement-group__title">Cut-In</div><Field label="Ref °C"><input className={inputCls} type="number" step="0.1" value={thPos[key].cutIn.ref} onChange={e=>setPosition(key,'cutIn','ref',e.target.value)} placeholder="Ref" /></Field><Field label="Freezer °C"><input className={inputCls} type="number" step="0.1" value={thPos[key].cutIn.freezer} onChange={e=>setPosition(key,'cutIn','freezer',e.target.value)} placeholder="Freezer" /></Field></div><div className="thermo-measurement-group"><div className="thermo-measurement-group__title">Cut-Out</div><Field label="Ref °C"><input className={inputCls} type="number" step="0.1" value={thPos[key].cutOut.ref} onChange={e=>setPosition(key,'cutOut','ref',e.target.value)} placeholder="Ref" /></Field><Field label="Freezer °C"><input className={inputCls} type="number" step="0.1" value={thPos[key].cutOut.freezer} onChange={e=>setPosition(key,'cutOut','freezer',e.target.value)} placeholder="Freezer" /></Field></div></div></div>))}</div>
                  <div className="test-action-row"><div className="test-action-row__fields"><Field label="Tester"><input className={inputCls} value={thTester} onChange={e=>setThTester(e.target.value)} placeholder="Name" /></Field></div><div className="test-action-row__action"><Btn onClick={submitTh} disabled={!thReady}><Icon name="plus" size={13}/> {editingThId ? "Update Thermostat" : "Log Thermostat"}</Btn>{!thReady && <div className="thermostat-action-hint">* Enter gas charge to enable</div>}</div></div>
                  <div className="notes-block"><div className="note-label"><span className="text-[11px] uppercase tracking-wider text-slate-400">Test Note</span><span className="note-hint">Optional — saved with this log</span></div><textarea className={`${inputCls} w-full`} rows="2" value={thNotes} onChange={e=>setThNotes(e.target.value)} placeholder="Record cycling behavior, drift, stability, unusual cut-in/cut-out, etc." /></div>
                </div>}
              </div></section>
          </div>

          <div className="flex items-center justify-between pt-2 border-t border-slate-800">
            <div className="text-xs text-slate-500">Outcome: <span className="text-slate-300 font-medium">{pair.outcome}</span></div>
            <div className="flex gap-2">
              {pair.qualityStatus !== "Submitted to Quality" && pair.qualityStatus !== "Approved" && <Btn variant="subtle" onClick={submitQuality}><Icon name="tag" size={13}/> Tag for Quality</Btn>}
              <Btn variant="danger" onClick={() => deletePair(pair.id)}><Icon name="trash" size={13}/> Remove Pair</Btn>

    </div>
  );
}
function AttemptHistory({ attempts, render, onEdit }) {
  if (!attempts || attempts.length === 0) return <div className="test-history__empty">No test records logged yet.</div>;
  return (
    <div>
      {attempts.map((a, i) => (
        <div key={a.id} className="log-row">
          <div className="log-row__top"><span className="log-row__number">#{i + 1}</span>{render(a)}<button type="button" className="log-edit-btn" onClick={() => onEdit && onEdit(a)} title="Edit this test log">✎ Edit</button></div>
        </div>
      ))}
    </div>
  );
}

function Quality({ pairsEnriched, modelsById, suppliersById, updatePairStatus }) {
  const relevant = pairsEnriched.filter(p => p.qualityStatus !== "Pending Test");
  const [reviewerDraft, setReviewerDraft] = useState({});
  const [commentDraft, setCommentDraft] = useState({});

    <div className="space-y-3">
      <div className="text-xs text-slate-500">Pairs can now be tagged for Quality directly from the testing record, regardless of test outcome.</div>

      {relevant.map(p => (
        <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-sm p-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="text-sm font-mono text-slate-200">{p.id}</div>
              <div className="text-xs text-slate-500">{modelsById[p.modelId]?.name} · {suppliersById[p.supplierId]?.name} · <span className="text-slate-400">{p.department || "Development"}</span></div>
            </div>
            <div className="flex items-center gap-4">
              <GaugeBadge status={p.pullDownStatus} label="Pull-Down" />
              <GaugeBadge status={p.thermostatStatus} label="Thermostat" />
              <Pill className={qStatusColor[p.qualityStatus]}>{p.qualityStatus}</Pill>
            </div>
          </div>
          {p.qualityStatus === "Submitted to Quality" && (
            <div className="mt-3 pt-3 border-t border-slate-800 flex flex-wrap items-end gap-2">
              <Field label="Reviewer"><input className={`${inputCls} w-40`} value={reviewerDraft[p.id] || ""} onChange={e => setReviewerDraft({ ...reviewerDraft, [p.id]: e.target.value })} placeholder="Name" /></Field>
              <Field label="Comments"><input className={`${inputCls} w-64`} value={commentDraft[p.id] || ""} onChange={e => setCommentDraft({ ...commentDraft, [p.id]: e.target.value })} placeholder="Optional" /></Field>
              <Btn variant="primary" onClick={() => decide(p.id, "Approved")}><Icon name="check" size={13} /> Approve</Btn>
              <Btn variant="danger" onClick={() => decide(p.id, "Rejected")}><Icon name="x" size={13} /> Reject</Btn>
              <Btn variant="ghost" onClick={() => decide(p.id, "Rework Requested")}><Icon name="alert" size={13} /> Rework</Btn>
            </div>
          )}
          {(p.qualityStatus === "Approved" || p.qualityStatus === "Rejected" || p.qualityStatus === "Rework Requested") && (
            <div className="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-500">Decided {p.decisionDate} by {p.reviewer} {p.comments && `— "${p.comments}"`}</div>
          )}
        </div>
      ))}
    </div>
  );
}


function TestingPlanning({data, pairsEnriched, setTab, setExpandedPair, persist}) {
  const [view, setView] = useState("kanban");
  const [weekStart, setWeekStart] = useState(() => {
    const d = new Date(); const day = d.getDay();
    d.setDate(d.getDate() - ((day + 6) % 7));
    return d.toISOString().slice(0,10);
  });
  const today = new Date().toISOString().slice(0,10);
  const statuses = ["Unplanned", "Planned", "In Progress", "Completed", "Cancelled"];
  const pairs = pairsEnriched || [];
  const statusOf = p => statuses.includes(p.planningStatus) ? p.planningStatus : (p.targetDate ? "Planned" : "Unplanned");
  const overdue = p => !!p.targetDate && p.targetDate < today && !["Completed","Cancelled","Unplanned"].includes(statusOf(p));
  const updatePair = (id, patch) => persist({...data, pairs: data.pairs.map(p => p.id === id ? {...p, ...patch} : p)});
  const changeStatus = (p, status) => {
    const patch = {planningStatus: status};
    if (status === "Completed") {
      patch.completedAt = new Date().toISOString();
      patch.completedBy = "Current user";
    } else {
      patch.completedAt = null;
      patch.completedBy = null;
    }
    updatePair(p.id, patch);
  };
  const openPair = id => { setExpandedPair(id); setTab("testing"); };
  const addDays = (dateStr,n) => { const d=new Date(dateStr+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const fmt = d => d ? new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"}) : "No target date";

  const columns = [
    ["Unplanned", pairs.filter(p => !p.targetDate && !["Completed","Cancelled"].includes(statusOf(p)))],
    ["Planned", pairs.filter(p => p.targetDate && statusOf(p)==="Planned" && !overdue(p))],
    ["In Progress", pairs.filter(p => statusOf(p)==="In Progress" && !overdue(p))],
    ["Overdue", pairs.filter(p => overdue(p))],
  ];
  const completed = pairs.filter(p => statusOf(p)==="Completed");
  const cancelled = pairs.filter(p => statusOf(p)==="Cancelled");
  const weekDays = Array.from({length:7},(_,i)=>addDays(weekStart,i));

  const Card = ({p}) => {
    const st=statusOf(p), isLate=overdue(p);
    return <div key={p.id} className={`planning-card ${isLate?"overdue":""}`} onClick={()=>openPair(p.id)}>
      <div className="planning-id">{p.id}</div>
      <div className="planning-meta">{p.model?.name || p.modelId} · {p.department || "Development"}</div>
      {p.note && <div className="planning-note"><b>Pair note:</b> {p.note}</div>}
      <div className="planning-note-edit" onClick={e => e.stopPropagation()}>
        <label>Planning note — what to do when the date arrives</label>
        <textarea
          value={p.planningNote || ""}
          onChange={e => updatePair(p.id, { planningNote: e.target.value })}
          placeholder="e.g. Run 24h load test with 73g R600a; check suction and discharge temperatures."
        />
      </div>
      <div className="flex items-center gap-2 flex-wrap mt-2">
        <span className={`planning-status-badge ${st === "Completed" ? "completed" : st === "In Progress" ? "progress" : "planned"}`}>{st}</span>
        {isLate && <span className="planning-overdue">OVERDUE</span>}
      </div>
      <div className="planning-date mt-2">{p.targetDate ? `Target: ${fmt(p.targetDate)}` : "No target date"}</div>
      <div className="mt-2" onClick={e=>e.stopPropagation()}>
        <select className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200" value={st} onChange={e=>changeStatus(p,e.target.value)}>
          {statuses.map(x=><option key={x} value={x}>{x}</option>)}
        </select>
        <input className="w-full mt-2 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200" type="date" value={p.targetDate || ""} onChange={e=>updatePair(p.id,{targetDate:e.target.value || null})}/>
      </div>
      {st === "Completed" && <div className="text-xs text-emerald-400 mt-2 font-semibold">Completed {p.completedAt ? new Date(p.completedAt).toLocaleDateString() : ""}</div>}
    </div>;
  };

  return <div className="space-y-5">
    <div className="flex items-center justify-between gap-3 flex-wrap">
      <div><Eyebrow>Testing Planning</Eyebrow><div className="text-sm text-slate-500 mt-1">Plan testing, track progress and complete pairs. Overdue is an indicator, not a permanent status.</div></div>
      <div className="flex gap-1 bg-slate-100 border border-slate-200 rounded-xl p-1">
        <button type="button" onClick={()=>setView("kanban")} className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${view==="kanban"?"bg-white shadow-sm text-slate-900":"text-slate-500"}`}>Kanban</button>
        <button type="button" onClick={()=>setView("calendar")} className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${view==="calendar"?"bg-white shadow-sm text-slate-900":"text-slate-500"}`}>Calendar</button>
      </div>
    </div>
    {view==="kanban" ? <>
      <div className="planning-board">
        {columns.map(([title,list])=><div className="planning-column" key={title}><h3>{title} · {list.length}</h3>{list.map(p=><Card p={p} key={p.id} />)}{!list.length&&<div className="text-xs text-slate-400 text-center py-8">Nothing here</div>}</div>)}
      </div>
      <div className="grid md:grid-cols-2 gap-4 mt-4">
        <div className="planning-column"><h3>Completed · {completed.length}</h3>{completed.map(p=><Card p={p} key={p.id}/>)}{!completed.length&&<div className="text-xs text-slate-400 text-center py-8">No completed pairs</div>}</div>
        <div className="planning-column"><h3>Cancelled · {cancelled.length}</h3>{cancelled.map(p=><Card p={p} key={p.id}/>)}{!cancelled.length&&<div className="text-xs text-slate-400 text-center py-8">No cancelled pairs</div>}</div>
      </div>
    </> : <div>
      <div className="flex gap-2 mb-3"><Btn variant="ghost" onClick={()=>setWeekStart(addDays(weekStart,-7))}>← Previous</Btn><Btn variant="ghost" onClick={()=>{const d=new Date(today+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));setWeekStart(d.toISOString().slice(0,10));}}>Current Week</Btn><Btn variant="ghost" onClick={()=>setWeekStart(addDays(weekStart,7))}>Next →</Btn></div>
      <div className="planning-calendar">{weekDays.map(d=><div className="planning-day" key={d}><div className="planning-day-title">{fmt(d)}</div>{pairs.filter(p=>p.targetDate===d && statusOf(p)!=="Cancelled").map(p=><div className={`planning-event ${overdue(p)?"overdue":""}`} key={p.id} title={p.planningNote || p.note || ""} onClick={()=>openPair(p.id)}>
        <b>{p.id}</b><br/>{p.model?.name || p.modelId}<br/><span>{statusOf(p)}{overdue(p)?" · OVERDUE":""}</span>
        {p.planningNote && <small>{p.planningNote}</small>}
      </div>)}</div>)}</div>
    </div>}
  </div>;
}

function MasterData({ data, addModel, updateModel, addSupplier, updateSupplier, addCompressor, updateCompressor, deleteModel, deleteSupplier, deleteCompressor }) {
  // Defensive normalization: old/local/API data may not contain every master-data
  // collection. Master Data must never blank the entire application because of that.
  const models = Array.isArray(data?.models) ? data.models : [];
  const suppliers = Array.isArray(data?.suppliers) ? data.suppliers : [];
  const compressors = Array.isArray(data?.compressors) ? data.compressors : [];

  const emptyPositions = () => ({
    min: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    p3: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    p5: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    mid: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
    max: { cutIn: { ref: "", freezer: "" }, cutOut: { ref: "", freezer: "" } },
  });

  const [m, setM] = useState(() => ({
    name: "", category: "Refrigerator",
    pullDownTargetMin: "", pullDownReachingTimeMin: "",
    pullDownTemps: { ref: "", freezer: "" },
    loadTemps: { ref: "", freezer: "" },
    thermoTolerance: "",
    thermoPositions: emptyPositions(),
    compressorId: "",
    compressorType: "",
    standardNote: "",
    referenceGasType: "", referenceGasCharge: "",
    referencePullDown: { testId: "" },
    referenceThermostat: { testId: "" }
  }));
  const [s, setS] = useState({ id: "", name: "" });
  const [c, setC] = useState(() => ({
    id: "", supplierId: suppliers[0]?.id || "", spec: "", type: "Fixed Speed",
    rpmMax: "", coolingCapacityW: "", cop: "", refrigerant: "R600a",
    maxCondensingTempC: "", maxAmbientTempC: "", maxShellTempC: "", maxDischargeTempC: "",
    displacementCc: "", oilType: "", oilChargeMl: "", evapTempMinC: "", evapTempMaxC: ""
  }));
  const [selectedCompressors, setSelectedCompressors] = useState([]);
  const [compareOpen, setCompareOpen] = useState(false);
  const [addMenuOpen, setAddMenuOpen] = useState(false);
  const [activeAddForm, setActiveAddForm] = useState(null);
  const [editingId, setEditingId] = useState(null);

/* ---------- Reminders ---------- */

  st.work.tasks.forEach(t => t.status !== "done" && t.dueDate && mk("w" + t.id, t.title, "Work task", t.dueDate, t.dueTime, t.remind, { space: "work", page: "project:" + (t.projectId || "inbox") }, t.created));

      <Row t="Currency symbol" s="Shown in the Budget section."><input style={{ maxWidth: 90 }} value={cur} onChange={e => setSt(s => ({ ...s, personal: { ...s.personal, budget: { ...s.personal.budget, currency: e.target.value } } }))} /></Row></div>
    <div className="ws-card set-card"><h4>Notifications</h4>
      <Row t="Status" s={perm === "granted" ? "On: you'll get reminders for tasks, lab tests and reading." : perm === "denied" ? "Blocked. Open your browser's site settings and allow Notifications." : perm === "unsupported" ? "This browser can't show system notifications." : "Not allowed yet."}>
        <button className="ws-btn ghost" onClick={testNotif}>{perm === "granted" ? "Send test notification" : "Enable notifications"}</button></Row>
      <Row t="Default reminder time" s="Used for tasks that have a date but no time."><input type="time" value={S.notifyAt} onChange={e => set("notifyAt", e.target.value || "09:00")} /></Row></div>
    <div className="ws-card set-card"><h4>Data</h4>
      <Row t="Backup & restore" s="Download a copy of everything, or restore from one."><button className="ws-btn ghost" onClick={openBackup}>Open</button></Row>
      <Row t="Where your data lives" s={WS_API ? "Synced to your server (MongoDB), so your phone and computer share the same data." : "Only in this browser. Use a backup to move it elsewhere."}>{WS_API && <button className="ws-btn ghost" onClick={checkServer}>Test connection</button>}</Row>
      {WS_API && hasKey && <Row t="Lock this device" s="Forget the access key here. You'll be asked for it again."><button className="ws-btn danger" onClick={() => { try { localStorage.removeItem("wb-key"); } catch (e) {} location.reload(); }}>Lock now</button></Row>}</div>
  </div>;
}

/* ---------- Root shell ---------- */
const WS_START = ({ journal: ["personal", "journal"], ptasks: ["personal", "ptasks"], today: ["personal", "today"], budget: ["personal", "budget"], reading: ["personal", "reading"], focus: ["work", "focus"], inbox: ["work", "project:inbox"], timeline: ["work", "timeline"], notes: ["work", "notes"], calendar: ["work", "calendar"], lab: ["work", "lab"] })[new URLSearchParams(location.search).get("go")] || ["work", "overview"];
function Root() {
  const [st, setSt] = useState(null), [err, setErr] = useState(""), [space, setSpace] = useState(WS_START[0]), [page, setPage] = useState(WS_START[1]);
  const [labReq, setLabReq] = useState(null), [dlg, setDlg] = useState(null), [toast, setToast] = useState(""), [bell, setBell] = useState(false), [fp, setFp] = useState(null);
  const [locked, setLocked] = useState(false), [keyIn, setKeyIn] = useState(""), dirty = useRef(false), ready = useRef(false);
  const [perm, setPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("wb-theme") || "auto"; } catch (e) { return "auto"; } });
  useEffect(() => {
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    const apply = () => { const dark = theme === "dark" || (theme === "auto" && mq && mq.matches); document.documentElement.dataset.theme = dark ? "dark" : "light"; const m = document.querySelector("meta[name=theme-color]"); if (m) m.content = dark ? "#09090b" : "#18181b"; };
    apply(); try { localStorage.setItem("wb-theme", theme); } catch (e) {}
    if (mq && mq.addEventListener) { mq.addEventListener("change", apply); return () => mq.removeEventListener("change", apply); }
  }, [theme]);
  useEffect(() => {
    window.__toast = m => { setToast(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToast(""), 4500); };
    window.__ask = (msg, fn) => setDlg({ t: "ask", msg, fn }); window.alert = m => window.__toast(String(m));
  }, []);
  useEffect(() => { (async () => { try { const d = await wsLoad(); setSt(wsNormalize(d)); ready.current = true; } catch (e) { if (e.message === "LOCKED") setLocked(true); else setErr("Could not load data: " + e.message + (WS_API ? " — check MONGODB_URI in Vercel and visit /api/health" : "")); } })(); }, []);
  useEffect(() => {
    if (!WS_API) return;
    const h = async () => { if (document.visibilityState !== "visible" || dirty.current || !ready.current) return; try { const d = await wsLoad(); if (d) setSt(s => JSON.stringify(wsNormalize(d)) === JSON.stringify(s) ? s : wsNormalize(d)); } catch (e) {} };
    document.addEventListener("visibilitychange", h); return () => document.removeEventListener("visibilitychange", h);
  }, []);
  useEffect(() => { if (!st || !ready.current) return; dirty.current = true; const t = setTimeout(() => wsSave(st).then(() => { dirty.current = false; setErr(""); }).catch(e => setErr("Couldn't save: " + e.message)), 350); return () => clearTimeout(t); }, [st]);
  useEffect(() => {
    if (typeof Notification === "undefined" || Notification.permission !== "default") return;
    const h = () => Notification.requestPermission().then(p => setPerm(p)).catch(() => {});
    window.addEventListener("pointerdown", h, { once: true }); return () => window.removeEventListener("pointerdown", h);
  }, []);
  useEffect(() => {
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register("sw.js").then(async reg => { try { if (reg.periodicSync) await reg.periodicSync.register("wb-due", { minInterval: 6 * 3600 * 1000 }); } catch (e) {} }).catch(() => {});
  }, []);
  useEffect(() => {
    if (!st) return;
    const run = () => {
      const now = Date.now(), td = todayStr(), items = openDated(st); let seen; try { seen = JSON.parse(localStorage.getItem("wb-notified") || "{}"); } catch (e) { seen = {}; }
      if (seen.d !== td) seen = { d: td, ids: [] };
      const keyOf = i => i.id + "@" + i.at + (i.repeat ? ":" + Math.floor((now - i.at) / (i.repeat * 60000)) : "");
      const fresh = items.filter(i => i.at <= now && !i.skip && !seen.ids.includes(keyOf(i)));
      if (fresh.length) {
        const f = fresh[0]; pushNotify(fresh.length === 1 ? f.title : `${fresh.length} items need attention`, fresh.length === 1 ? `${f.sub} · ${f.repeat ? "time to read" : f.kind === "start" ? (f.time ? "starts " + hhmm(f.time) : "starts today") : f.time ? "due " + hhmm(f.time) : f.date < td ? "overdue" : "due today"}` : fresh.slice(0, 4).map(i => i.title).join(", "));
        seen.ids.push(...fresh.map(keyOf)); try { localStorage.setItem("wb-notified", JSON.stringify(seen)); } catch (e) {}
      }
      try { caches.open("wb-data").then(c => { c.put("due.json", new Response(JSON.stringify({ items }))); c.put("notified.json", new Response(JSON.stringify(seen))); }); } catch (e) {}
    };
    run(); const t = setInterval(run, 30000); return () => clearInterval(t);
  }, [st]);
  if (locked) return <div className="dlg-bg" style={{ background: "var(--pg)" }}><div className="dlg" style={{ border: "1px solid #e4e4e7" }}><h3>Workbench is locked</h3><p className="sub">Enter your access key to open your data.</p>
    <input type="password" autoFocus value={keyIn} onChange={e => setKeyIn(e.target.value)} onKeyDown={e => e.key === "Enter" && (localStorage.setItem("wb-key", keyIn), location.reload())} style={{ width: "100%", padding: 10 }} />
    <div className="dlg-act"><button className="ws-btn" onClick={() => { localStorage.setItem("wb-key", keyIn); location.reload(); }}>Unlock</button></div></div></div>;
  if (!st) return <div style={{ padding: 40, color: "#71717a" }}>{err || "Loading…"}</div>;
  WS_H24 = !!st.settings.hour24; WS_WEEK = st.settings.week === 0 ? 0 : 1; WS_NOTIFY = st.settings.notifyAt || "09:00";
  const setWork = fn => setSt(s => ({ ...s, work: fn(s.work) })), setPers = fn => setSt(s => ({ ...s, personal: fn(s.personal) })), setLab = fn => setSt(s => ({ ...s, lab: fn(s.lab) })), setFocus = fn => setSt(s => ({ ...s, focus: fn(s.focus) }));
  const go = p => { setPage(p); setBell(false); window.scrollTo(0, 0); };
  const switchSpace = s => { setSpace(s); setPage(s === "work" ? "overview" : "today"); };
  const openPair = id => { setSpace("work"); setPage("lab"); setLabReq({ tab: id ? "testing" : "planning", pairId: id, n: Date.now() }); setBell(false); };
  const goItem = it => { if (it.to.pair) return openPair(it.to.pair); setSpace(it.to.space); setPage(it.to.page); setBell(false); };
  const goFocus = label => { setFp({ label, n: Date.now() }); go("focus"); };
  const saveProject = f => { if (f.id) { const old = st.work.projects.find(x => x.id === f.id) || {}, ch = ["startDate", "startTime", "endDate", "endTime"].some(q => (old[q] || "") !== (f[q] || "")); setWork(w => ({ ...w, projects: w.projects.map(x => x.id === f.id ? { ...f, created: ch ? Date.now() : x.created } : x) })); } else { const id = uid("pr"); setWork(w => ({ ...w, projects: [...w.projects, { ...f, id, created: Date.now() }] })); setSpace("work"); setPage("project:" + id); } setDlg(null); };
  const ui = { ask: (msg, fn) => setDlg({ t: "ask", msg, fn }), projectForm: p => setDlg({ t: "project", p: p || null }) };
  const nowMs = Date.now(), td = todayStr(), due = openDated(st).filter(i => i.date < td || i.at <= nowMs);
  const NI = ({ id, icon, dot, children }) => <button className={`ni ${page === id ? "on" : ""}`} onClick={() => go(id)}>{dot ? <span className="ws-dot" style={{ background: dot }} /> : <Icon name={icon} size={18} />}{children}</button>;
  const Switch = <div className="ws-switch"><button className={space === "work" ? "on" : ""} onClick={() => switchSpace("work")}>Work</button><button className={space === "personal" ? "on" : ""} onClick={() => switchSpace("personal")}>Personal</button></div>;
  const Bell = <button className="ws-ic" title="Reminders" onClick={() => setBell(b => !b)}><Icon name="bell" size={19} />{due.length > 0 && <i>{due.length}</i>}</button>;
  const view = page === "settings" ? <SettingsPage st={st} setSt={setSt} theme={theme} setTheme={setTheme} perm={perm} setPerm={setPerm} openBackup={() => setDlg({ t: "backup" })} />
    : page === "notes" ? <NotesPage key={space} scope={space} notes={space === "personal" ? st.personal.notes : st.work.notes} setNotes={fn => space === "personal" ? setPers(p => ({ ...p, notes: fn(p.notes || []) })) : setWork(w => ({ ...w, notes: fn(w.notes || []) }))} />
    : page === "focus" ? <FocusPage st={st} setFocus={setFocus} setWork={setWork} setPers={setPers} preset={fp} />
    : space === "personal"
    ? (page === "journal" ? <Journal st={st} setPers={setPers} /> : page === "ptasks" ? <PersonalTasks st={st} setPers={setPers} /> : page === "budget" ? <BudgetPage st={st} setPers={setPers} /> : page === "reading" ? <ReadingPage st={st} setPers={setPers} goFocus={goFocus} /> : <PersonalToday st={st} setPers={setPers} go={go} />)
    : page === "lab" ? <LabApp data={st.lab} persist={next => setLab(() => next)} req={labReq} />
    : page === "timeline" ? <TimelinePage st={st} setWork={setWork} />
    : page === "calendar" ? <CalendarPage st={st} go={go} openPair={openPair} />
    : page === "people" ? <PeoplePage st={st} setWork={setWork} />
    : page.startsWith("project:") ? <ProjectPage key={page} st={st} setWork={setWork} pid={page.slice(8)} go={go} />
    : <WorkOverview st={st} go={go} openPair={openPair} />;
  const bn = space === "work" ? [["overview", "home", "Home"], ["project:inbox", "inbox", "Inbox"], ["notes", "note", "Notes"], ["lab", "gauge", "Lab"], ["calendar", "cal", "Calendar"], ["focus", "timer", "Focus"]]
    : [["today", "home", "Today"], ["ptasks", "check", "Tasks"], ["journal", "book", "Journal"], ["notes", "note", "Notes"], ["budget", "wallet", "Money"], ["reading", "bookopen", "Reading"]];
  return <UICtx.Provider value={ui}><div className={`ws ${space}`}>
    <aside className="ws-side">
      <div className="ws-brand"><div className="ws-logo"><Icon name="kanban" size={19} /></div><b>Workbench</b>{Bell}</div>
      {Switch}
      <div className="ws-nav">{space === "work" ? <>
        <NI id="overview" icon="home">Overview</NI><NI id="project:inbox" icon="inbox">Inbox</NI><NI id="notes" icon="note">Notes</NI>
        <h6>PROJECTS</h6>{st.work.projects.map(p => <NI key={p.id} id={"project:" + p.id} dot={p.color}>{p.name}</NI>)}
        <h6>LAB</h6><NI id="lab" icon="gauge">Charge Verification</NI>
        <h6>PLAN</h6><NI id="calendar" icon="cal">Calendar</NI><NI id="timeline" icon="gantt">Timeline</NI><NI id="people" icon="users">People</NI><NI id="focus" icon="timer">Focus timer</NI>
      </> : <><NI id="today" icon="home">Today</NI><NI id="ptasks" icon="check">My tasks</NI><NI id="journal" icon="book">Journal</NI><NI id="notes" icon="note">Notes</NI>
        <h6>LIFE</h6><NI id="budget" icon="wallet">Budget</NI><NI id="reading" icon="bookopen">Reading</NI><NI id="focus" icon="timer">Focus timer</NI></>}</div>
      <div className="ws-foot"><button className={`ni ${page === "settings" ? "on" : ""}`} onClick={() => go("settings")}><Icon name="gear" size={17} />Settings</button>{WS_API ? "Synced to your server" : "Saved in this browser"}</div>
    </aside>
    <div className="ws-col">
      <header className="ws-top"><b>Workbench</b>{Switch}{Bell}<button className="ws-ic" title="Settings" onClick={() => go("settings")}><Icon name="gear" size={19} /></button></header>
      <main className="ws-main">{err && <div className="ws-err">{err}</div>}{view}</main>
      <div className="ws-bnav">{bn.map(([id, ic, l]) => <button key={id} className={page === id ? "on" : ""} onClick={() => go(id)}><Icon name={ic} size={22} /><span>{l}</span></button>)}</div>
    </div>
    {bell && <div className="bell-pop"><h5>Needs attention · {due.length}</h5>
      {due.length ? due.slice(0, 8).map(i => <div key={i.id} className="ws-row" onClick={() => goItem(i)}><span>{i.title}</span><span className={`d ${i.date < td ? "late" : ""}`}>{i.kind === "start" ? (i.time ? "Starts " + hhmm(i.time) : "Starts today") : i.date < td ? "Overdue" : i.time ? hhmm(i.time) : "Today"}</span></div>) : <p className="sub" style={{ margin: 0, fontSize: 13, color: "#71717a" }}>Nothing due. You're all caught up.</p>}
      <p style={{ fontSize: 11, color: "#a1a1aa", margin: "10px 0 0" }}>{perm === "granted" ? "System notifications are on." : perm === "denied" ? "Notifications are blocked in your browser settings." : perm === "unsupported" ? "This browser can't show system notifications." : "Click anywhere to allow system notifications."}</p></div>}
    {dlg?.t === "ask" && <ConfirmDialog msg={dlg.msg} onYes={() => { dlg.fn(); setDlg(null); }} onClose={() => setDlg(null)} />}
    {dlg?.t === "project" && <ProjectDialog p={dlg.p} onSave={saveProject} onClose={() => setDlg(null)} />}
    {dlg?.t === "backup" && <BackupDialog st={st} onClose={() => setDlg(null)} onRestore={d => { setSt(wsNormalize(d)); setDlg(null); window.__toast("Backup restored"); }} />}
    {toast && <div className="toast">{toast}</div>}
  </div></UICtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
