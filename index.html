<style>
  .test-panel{background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(2,6,23,.96));border:1px solid #1e293b;border-radius:6px;overflow:hidden;}
  .test-panel__header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid #1e293b;background:rgba(15,23,42,.8);}
  .test-panel__title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#e2e8f0;}
  .test-panel__subtitle{font-size:10px;color:#64748b;margin-top:3px;}
  .test-panel__body{padding:14px;}
  .test-history{margin-bottom:14px;}
  .test-history__label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;}
  .test-history__empty{padding:9px 10px;border:1px dashed #334155;border-radius:4px;color:#64748b;font-size:11px;background:rgba(2,6,23,.35);}
  .log-row{display:block;padding:9px 10px;border:1px solid #1e293b;border-radius:4px;background:#0b1220;margin-bottom:6px;}
  .log-row:last-child{margin-bottom:0;}
  .log-row__top{display:flex;align-items:flex-start;gap:9px;}
  .log-row__number{flex:0 0 25px;color:#64748b;font:11px 'IBM Plex Mono',monospace;padding-top:1px;}
  .log-row__main{min-width:0;flex:1;}
  .log-row__value{font:11px/1.55 'IBM Plex Mono',monospace;color:#e2e8f0;word-break:break-word;}
  .log-row__meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:#64748b;}
  .log-row__note{margin-top:7px;padding:6px 8px;border-left:2px solid #334155;background:rgba(15,23,42,.7);font-size:10px;line-height:1.45;color:#94a3b8;}
  .measurement-block{border:1px solid #1e293b;border-radius:5px;background:rgba(15,23,42,.48);padding:11px;margin-bottom:10px;}
  .measurement-block__title{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7dd3fc;margin-bottom:9px;}
  .measurement-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .position-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
  .position-card{border:1px solid #1e293b;border-radius:5px;background:#0b1220;padding:10px;}
  .position-card__title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5eead4;}
  .position-card__target{font-size:9px;color:#64748b;font-weight:500;letter-spacing:0;text-transform:none;}
  .position-grid__fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .log-footer{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:9px;align-items:end;margin-top:10px;padding-top:11px;border-top:1px solid #1e293b;}
  .required-field input{border-color:#7f1d1d;}
  .required-field input:focus{border-color:#ef4444;box-shadow:0 0 0 1px rgba(239,68,68,.25);}
  .required-mark{color:#fb7185;font-weight:700;}
  .required-hint{font-size:9px;color:#64748b;margin-top:5px;}
  .gas-field{background:rgba(120,53,15,.14);border:1px solid #713f12;border-radius:5px;padding:7px;}
  .gas-field input{background:#020617;border-color:#92400e;}
  .gas-field label span{color:#fbbf24;}
  .thermo-reference{font-size:10px;color:#64748b;padding:7px 9px;border:1px solid #1e293b;border-radius:4px;background:#0b1220;margin-bottom:10px;}

function pullDownResult(model, measured) {
  if (!model || measured === "" || measured === null || measured === undefined) return null;
  return Number(measured) <= model.pullDownTargetMin + model.pullDownToleranceMin ? "Pass" : "Fail";
}
function thermostatResult(model, attempt) {
  if (!model || !attempt) return null;

  if (attempt.positions) {
    const pos = attempt.positions;
    const complete = THERMO_POSITION_DEFS.every(([k]) =>
      pos[k] && pos[k].cutIn !== "" && pos[k].cutOut !== "" &&
      pos[k].cutIn !== null && pos[k].cutOut !== null
    );
    if (!complete) return null;

    const targets = THERMO_POSITION_DEFS.map(([key]) => [key, thermoTargetFor(model, key)]);
    // A thermostat result can only be a full engineering comparison when
    // the model contains target values for all four positions.
    if (!targets.every(([, target]) => target && target.cutIn !== "" && target.cutOut !== "")) return null;

    const withinTolerance = ([key, target]) => {
      const measured = pos[key];
      return Math.abs(Number(measured.cutIn) - Number(target.cutIn)) <= Number(model.thermoTolerance) &&
             Math.abs(Number(measured.cutOut) - Number(target.cutOut)) <= Number(model.thermoTolerance);
    };
    return targets.every(withinTolerance) ? "Pass" : "Fail";
  }

  // Backward compatibility for old thermostat records/models.
  if (attempt.cutIn === "" || attempt.cutOut === "" || attempt.cutIn === null || attempt.cutOut === null) return null;
  const minTarget = thermoTargetFor(model, "min");
  if (!minTarget) return null;
  const okIn = Math.abs(Number(attempt.cutIn) - Number(minTarget.cutIn)) <= Number(model.thermoTolerance);
  const okOut = Math.abs(Number(attempt.cutOut) - Number(minTarget.cutOut)) <= Number(model.thermoTolerance);
  return okIn && okOut ? "Pass" : "Fail";
}
function latestAttempt(list) { return (!list || list.length === 0) ? null : list[list.length - 1]; }
function overallOutcome(pair, model) {
  const pd = latestAttempt(pair.pullDownAttempts);
  const th = latestAttempt(pair.thermostatAttempts);
  const pdRes = pd ? pullDownResult(model, pd.measured) : null;
  const thRes = th ? thermostatResult(model, th) : null;
  if (!pdRes && !thRes) return "No tests yet";
  if (!pdRes || !thRes) return "Incomplete";
  if (pdRes === "Pass" && thRes === "Pass") return "All Passed";
  if (pdRes === "Fail" && thRes === "Fail") return "All Failed";
  return "Mixed";
}

};

function Eyebrow({ children }) {
  return <div className="text-[11px] tracking-[0.18em] uppercase font-medium text-slate-400">{children}</div>;
}
function Readout({ value, className = "" }) {
  return <div className={`text-3xl font-semibold text-slate-50 ${className}`} style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{value}</div>;
}
function Kpi({ label, value, accent = "text-slate-900", onClick }) {
  const theme = {
    "Pairs Tracked": "kpi-blue",
    "Pull-Down Pass Rate": "kpi-teal",
    "Thermostat Pass Rate": "kpi-violet",
    "Awaiting Quality": "kpi-amber",
    "Approved": "kpi-green",

  }[label] || "kpi-blue";
  return (
    <button type="button" onClick={onClick}
      className={`kpi-card ${theme} group w-full text-left border p-4 relative overflow-hidden shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-sky-300`}>
      <div className="kpi-card__glow" />
      <div className="kpi-card__top">
        <span className="kpi-card__label">{label}</span>
        <span className="kpi-card__arrow">↗</span>
      </div>
      <div className="kpi-card__value">{value}</div>
      <div className="kpi-card__action">View units <span>→</span></div>

}
function GaugeBadge({ status, label }) {
  const map = {
    Pass: { ring: "stroke-emerald-400", text: "text-emerald-300" },
    Fail: { ring: "stroke-rose-400", text: "text-rose-300" },
    null: { ring: "stroke-slate-600", text: "text-slate-500" },
  };
  const cfg = map[status] || map[null];
  return (
    <div className="flex items-center gap-1.5">
      <svg width="20" height="20" viewBox="0 0 20 20" className="shrink-0">
        <circle cx="10" cy="10" r="8" fill="none" strokeWidth="2" className="stroke-slate-800" />
        <circle cx="10" cy="10" r="8" fill="none" strokeWidth="2" strokeLinecap="round"
                className={cfg.ring} strokeDasharray={status ? "50.3 50.3" : "6 4"}
                transform="rotate(-90 10 10)" />
      </svg>
      <span className={`text-[11px] font-medium ${cfg.text}`}>{label}</span>
    </div>
  );
}
function Pill({ children, className }) {
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-sm border text-[11px] font-medium tracking-wide ${className}`}>{children}</span>;
}
function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-[11px] uppercase tracking-wider text-slate-400">{label}</span>
      {children}

}
const inputCls = "bg-slate-950 border border-slate-700 rounded-sm px-2.5 py-1.5 text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-teal-500 focus:border-teal-500 placeholder-slate-600";

function Btn({ children, onClick, variant = "primary", className = "", disabled }) {
  const base = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-sm text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-teal-600 hover:bg-teal-500 text-white",
    ghost: "bg-transparent hover:bg-slate-800 text-slate-300 border border-slate-700",
    danger: "bg-rose-900/40 hover:bg-rose-900/70 text-rose-300 border border-rose-800",
    subtle: "bg-slate-800 hover:bg-slate-700 text-slate-200",
  };
  return <button type="button" onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>{children}</button>;
}

function LabApp({ data, persist, req }) {
  const [tab, setTab] = useState("dashboard");
  const [expandedPair, setExpandedPair] = useState(null);
  const [testingFilter, setTestingFilter] = useState("all");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  useEffect(() => { if (req) { if (req.pairId) setExpandedPair(req.pairId); setTab(req.tab || "testing"); } }, [req]);

  const modelsById = useMemo(() => Object.fromEntries((data?.models || []).map(m => [m.id, m])), [data]);
  const suppliersById = useMemo(() => Object.fromEntries((data?.suppliers || []).map(s => [s.id, s])), [data]);
  const compressorsById = useMemo(() => Object.fromEntries((data?.compressors || []).map(c => [c.id, c])), [data]);

  const pairsEnriched = useMemo(() => {
    if (!data) return [];
    return data.pairs.map(p => {
      const model = modelsById[p.modelId];
      const pd = latestAttempt(p.pullDownAttempts);
      const th = latestAttempt(p.thermostatAttempts);
      return {
        ...p, model, department: p.department || "Development",
        pullDownStatus: pd ? pullDownResult(model, pd.measured) : null,
        thermostatStatus: th ? thermostatResult(model, th) : null,
        outcome: overallOutcome(p, model),
      };
    });
  }, [data, modelsById]);

  const kpis = useMemo(() => {
    const total = pairsEnriched.length;
    const awaiting = pairsEnriched.filter(p => p.qualityStatus === "Submitted to Quality").length;
    const approved = pairsEnriched.filter(p => p.qualityStatus === "Approved").length;
    const rejected = pairsEnriched.filter(p => p.qualityStatus === "Rejected" || p.qualityStatus === "Rework Requested").length;
    const pdAttempts = pairsEnriched.flatMap(p => p.pullDownAttempts.map(a => pullDownResult(p.model, a.measured)));
    const thAttempts = pairsEnriched.flatMap(p => p.thermostatAttempts.map(a => thermostatResult(p.model, a)));
    const rate = (arr) => { const done = arr.filter(Boolean); return done.length === 0 ? "—" : Math.round((done.filter(r => r === "Pass").length / done.length) * 100) + "%"; };
    return { total, awaiting, approved, rejected, pdRate: rate(pdAttempts), thRate: rate(thAttempts) };
  }, [pairsEnriched]);

  const addPair = (modelId, supplierId, compressorId, department, note = "", targetDate = "", planningNote = "") => {
    const id = `${modelId}_${supplierId}_${compressorId}`;
    if (data.pairs.some(p => p.id === id)) { alert("This Model + Supplier + Compressor combination already exists."); return false; }
    persist({
      ...data,
      pairs: [...data.pairs, { id, modelId, supplierId, compressorId, department: department || "Development", note: note.trim(), targetDate: targetDate || null, dateAdded: new Date().toISOString().slice(0, 10),
        pullDownAttempts: [], thermostatAttempts: [], planningStatus: targetDate ? "Planned" : "Unplanned", planningNote: planningNote.trim(), completedAt: null, completedBy: null, qualityStatus: "Pending Test", submittedDate: "", decisionDate: "", reviewer: "", comments: "" }],
    });
    return true;
  };
  const addAttempt = (pairId, kind, attempt) => {
    persist({
      ...data,
      pairs: data.pairs.map(p => {
        if (p.id !== pairId) return p;
        const key = kind === "pulldown" ? "pullDownAttempts" : "thermostatAttempts";
        const wasEmpty = p.pullDownAttempts.length === 0 && p.thermostatAttempts.length === 0;
        return { ...p, [key]: [...p[key], attempt], qualityStatus: p.qualityStatus === "Pending Test" && wasEmpty ? "In Test" : p.qualityStatus };
      }),
    });
  };
  const updatePairStatus = (pairId, patch) => persist({ ...data, pairs: data.pairs.map(p => (p.id === pairId ? { ...p, ...patch } : p)) });
  const deletePair = (pairId) => persist({ ...data, pairs: data.pairs.filter(p => p.id !== pairId) });
  const addModel = (m) => persist({ ...data, models: [...data.models, m] });
  const addSupplier = (s) => persist({ ...data, suppliers: [...data.suppliers, s] });
  const addCompressor = (c) => persist({ ...data, compressors: [...data.compressors, c] });
  const deleteModel = (modelId) => {
    if (data.pairs.some(p => p.modelId === modelId)) { alert("This model is used by one or more pairs. Remove those pairs first."); return; }
    window.__ask("Delete this model from Master Data?", () => persist({ ...data, models: data.models.filter(m => m.id !== modelId) })); return;
  };
  const deleteSupplier = (supplierId) => {
    if (data.pairs.some(p => p.supplierId === supplierId) || data.compressors.some(c => c.supplierId === supplierId)) { alert("This supplier is used by a pair or compressor lot. Remove those dependencies first."); return; }
    window.__ask("Delete this supplier from Master Data?", () => persist({ ...data, suppliers: data.suppliers.filter(x => x.id !== supplierId) })); return;
  };
  const deleteCompressor = (compressorId) => {
    if (data.pairs.some(p => p.compressorId === compressorId)) { alert("This compressor lot is used by one or more pairs. Remove those pairs first."); return; }
    window.__ask("Delete this compressor lot from Master Data?", () => persist({ ...data, compressors: data.compressors.filter(x => x.id !== compressorId) })); return;
  };

  return (
    <div className="min-h-screen text-slate-200 p-4 md:p-8">
      <div className="max-w-7xl mx-auto">
        <div className="bg-slate-950 border border-slate-800 rounded-md overflow-hidden">
          <div className="bg-slate-900 border-b border-slate-800 px-5 py-4 flex items-center justify-between flex-wrap gap-3">
            <div>
              <div className="flex items-center gap-2">
                <Icon name="gauge" size={22} className="text-teal-400" />
                <h1 className="text-xl font-semibold tracking-wide text-slate-50" style={{ fontFamily: "Oswald", letterSpacing: "0.03em" }}>
                  CHARGE&nbsp;VERIFICATION&nbsp;LAB
                </h1>
              </div>
              <p className="text-xs text-slate-500 mt-0.5 ml-8">Pull-Down &amp; Thermostat qualification tracker · Refrigerators &amp; Water Dispensers</p>
            </div>
            <div className="app-nav-wrap">
              <button type="button" className="mobile-menu-btn" onClick={() => setMobileNavOpen(v => !v)}
                aria-label="Toggle navigation" aria-expanded={mobileNavOpen}>
                <span></span><span></span><span></span>
              </button>
              <nav className={`flex gap-1 bg-slate-950 border border-slate-800 rounded-sm p-1 app-nav ${mobileNavOpen ? "mobile-open" : ""}`}>
                {[["dashboard", "Dashboard"], ["testing", "Pairs & Testing"], ["planning", "Planning"], ["quality", "Quality Approvals"], ["master", "Master Data"]].map(([key, label]) => (
                  <button key={key} onClick={() => { setTab(key); setMobileNavOpen(false); }}
                    className={`px-3 py-1.5 text-xs font-medium rounded-sm uppercase tracking-wide transition-colors ${tab === key ? "bg-teal-600 text-white" : "text-slate-400 hover:text-slate-200"}`}>
                    {label}
                  </button>
                ))}
              </nav>
            </div>
          </div>

          <div className="p-5">
            {tab === "dashboard" && <Dashboard kpis={kpis} pairsEnriched={pairsEnriched} data={data} persist={persist} setTab={setTab} setExpandedPair={setExpandedPair} onOpenTesting={(filter) => { setTestingFilter(filter); setTab("testing"); }} />}
            {tab === "testing" && (
              <Testing data={data} pairsEnriched={pairsEnriched} modelsById={modelsById} suppliersById={suppliersById}
                compressorsById={compressorsById} expandedPair={expandedPair} setExpandedPair={setExpandedPair}
                testingFilter={testingFilter} onClearTestingFilter={() => setTestingFilter("all")} addPair={addPair} addAttempt={addAttempt} deletePair={deletePair} updatePairStatus={updatePairStatus} />
            )}
            {tab === "planning" && <TestingPlanning data={data} pairsEnriched={pairsEnriched} setTab={setTab} setExpandedPair={setExpandedPair} persist={persist} />}
            {tab === "quality" && <Quality pairsEnriched={pairsEnriched} modelsById={modelsById} suppliersById={suppliersById} updatePairStatus={updatePairStatus} />}
            {tab === "master" && <MasterData data={data} addModel={addModel} addSupplier={addSupplier} addCompressor={addCompressor}
                deleteModel={deleteModel} deleteSupplier={deleteSupplier} deleteCompressor={deleteCompressor} />}
          </div>
        </div>
      </div>
    </div>
  );
}

function getCurrentGasCharge(pair) {
  const attempts = [
    ...(pair.pullDownAttempts || []).map(a => ({ ...a, _type: "Pull-Down" })),
    ...(pair.thermostatAttempts || []).map(a => ({ ...a, _type: "Thermostat" }))
  ].filter(a => a.gasCharge !== undefined && a.gasCharge !== null && a.gasCharge !== "");
  if (!attempts.length) return null;
  attempts.sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  return attempts[attempts.length - 1].gasCharge;
}

function Dashboard({ kpis, pairsEnriched, data, persist, onOpenTesting, setTab, setExpandedPair }) {
  const awaitingList = pairsEnriched.filter(p => p.qualityStatus === "Submitted to Quality");
  const mixedList = pairsEnriched.filter(p => p.outcome === "Mixed");
  const cards = [
    { label: "Pairs Tracked", value: kpis.total, filter: "all", accent: "text-slate-900" },
    { label: "Pull-Down Pass Rate", value: kpis.pdRate, filter: "pulldown-pass", accent: "text-sky-600" },
    { label: "Thermostat Pass Rate", value: kpis.thRate, filter: "thermostat-pass", accent: "text-teal-600" },
    { label: "Awaiting Quality", value: kpis.awaiting, filter: "awaiting-quality", accent: "text-amber-600" },
    { label: "Approved", value: kpis.approved, filter: "approved", accent: "text-emerald-600" },
    { label: "Rejected / Rework", value: kpis.rejected, filter: "rejected", accent: "text-rose-600" },
  ];
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
        {cards.map(card => <Kpi key={card.label} {...card} onClick={() => onOpenTesting(card.filter)} />)}
      </div>
      {kpis.awaiting > 0 && (
        <div className="awaiting-quality-banner bg-amber-50 border border-amber-200 rounded-2xl p-4 shadow-sm">
          <div className="flex items-center justify-between gap-3 mb-2">
            <div className="flex items-center gap-2">
              <Icon name="alert" size={16} className="text-amber-600" />
              <span className="text-sm font-medium text-amber-900">{kpis.awaiting} pair{kpis.awaiting > 1 ? "s" : ""} submitted to Quality with no decision yet</span>
            </div>
            <button type="button" onClick={() => onOpenTesting("awaiting-quality")} className="text-xs font-semibold text-amber-700 hover:text-amber-900">View all →</button>
          </div>
          <div className="flex flex-wrap gap-2">
            {awaitingList.map(p => {
              const currentCharge = getCurrentGasCharge(p);
              return (
                <Pill key={p.id} className="awaiting-unit-pill text-amber-800 bg-white border-amber-200">
                  <span className="font-semibold">{p.id}</span>
                  <span className="awaiting-pill-divider">·</span>
                  <span>Charge: <b>{currentCharge !== null ? `${currentCharge} g` : "—"}</b></span>
                  <span className="awaiting-pill-divider">·</span>
                  <span>sent {p.submittedDate || "—"}</span>
                </Pill>
              );
            })}
          </div>
        </div>
      )}
      {mixedList.length > 0 && (
        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
          <div className="flex items-center justify-between gap-3">
            <Eyebrow>Needs a closer look — pull-down and thermostat disagree</Eyebrow>
            <button type="button" onClick={() => onOpenTesting("mixed")} className="text-xs font-semibold text-sky-600 hover:text-sky-800">View units →</button>
          </div>
          <div className="mt-3 space-y-2">
            {mixedList.map(p => (
              <div key={p.id} className="flex items-center justify-between text-sm border-b border-slate-100 pb-2 last:border-0">
                <span className="font-mono text-xs text-slate-600">{p.id}</span>
                <div className="flex items-center gap-4"><GaugeBadge status={p.pullDownStatus} label="Pull-Down" /><GaugeBadge status={p.thermostatStatus} label="Thermostat" /></div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function Testing({ data, pairsEnriched, modelsById, suppliersById, compressorsById, expandedPair, setExpandedPair, testingFilter = "all", onClearTestingFilter, addPair, addAttempt, deletePair, updatePairStatus }) {
  const [addOpen, setAddOpen] = useState(false);
  const [newModel, setNewModel] = useState(data.models[0]?.id || "");
  const [newSupplier, setNewSupplier] = useState(data.suppliers[0]?.id || "");
  const [newCompressor, setNewCompressor] = useState(data.compressors[0]?.id || "");
  const [newDepartment, setNewDepartment] = useState("Development");
  const [newPairNote, setNewPairNote] = useState("");
  const [newTargetDate, setNewTargetDate] = useState("");
  const [newPlanningNote, setNewPlanningNote] = useState("");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("newest");

  const filterLabels = { all: "All pairs", "pulldown-pass": "Pull-Down passed", "thermostat-pass": "Thermostat passed", "awaiting-quality": "Awaiting Quality", approved: "Approved", rejected: "Rejected / Rework", mixed: "Mixed outcome" };

  const visiblePairs = useMemo(() => {
    const q = search.trim().toLowerCase();
    const filtered = pairsEnriched.filter(p => {
      const filterMatch = testingFilter === "all" ||
        (testingFilter === "pulldown-pass" && p.pullDownStatus === "Pass") ||
        (testingFilter === "thermostat-pass" && p.thermostatStatus === "Pass") ||
        (testingFilter === "awaiting-quality" && p.qualityStatus === "Submitted to Quality") ||
        (testingFilter === "approved" && p.qualityStatus === "Approved") ||
        (testingFilter === "rejected" && (p.qualityStatus === "Rejected" || p.qualityStatus === "Rework Requested")) ||
        (testingFilter === "mixed" && p.outcome === "Mixed");
      if (!filterMatch) return false;
      if (!q) return true;
      const haystack = [
        p.id, p.department, p.qualityStatus, p.outcome, p.note, p.planningNote, p.targetDate,
        modelsById[p.modelId]?.name, p.modelId,
        suppliersById[p.supplierId]?.name, p.supplierId,
        compressorsById[p.compressorId]?.id, compressorsById[p.compressorId]?.spec
      ].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    });
    return [...filtered].sort((a,b) => {
      switch (sortBy) {
        case "oldest": return String(a.dateAdded).localeCompare(String(b.dateAdded)) || a.id.localeCompare(b.id);
        case "id": return a.id.localeCompare(b.id);
        case "model": return (modelsById[a.modelId]?.name || "").localeCompare(modelsById[b.modelId]?.name || "") || a.id.localeCompare(b.id);
        case "supplier": return (suppliersById[a.supplierId]?.name || "").localeCompare(suppliersById[b.supplierId]?.name || "") || a.id.localeCompare(b.id);
        case "department": return (a.department || "").localeCompare(b.department || "") || a.id.localeCompare(b.id);
        case "status": return (a.qualityStatus || "").localeCompare(b.qualityStatus || "") || a.id.localeCompare(b.id);
        case "outcome": return (a.outcome || "").localeCompare(b.outcome || "") || a.id.localeCompare(b.id);
        case "newest":
        default: return String(b.dateAdded).localeCompare(String(a.dateAdded)) || b.id.localeCompare(a.id);
      }
    });
  }, [pairsEnriched, search, sortBy, testingFilter, modelsById, suppliersById, compressorsById]);

  const submitNewPair = () => {
    if (!newModel || !newSupplier || !newCompressor || !newDepartment) return;
    const created = addPair(newModel, newSupplier, newCompressor, newDepartment, newPairNote, newTargetDate, newPlanningNote);
    if (created !== false) {
      setAddOpen(false);
      setNewDepartment("Development");
      setNewPairNote(""); setNewTargetDate(""); setNewPlanningNote("");
    }
  };

  return (
    <div className="space-y-4">
      <div className="testing-toolbar">
        <div className="testing-toolbar__top">
          <div>
            <Eyebrow>Pairs &amp; Testing</Eyebrow>
            <div className="text-xs text-slate-500 mt-1">Search, sort and open a pair to record Pull-Down and Thermostat results.</div>
          </div>
          <Btn onClick={() => setAddOpen(true)}><Icon name="plus" size={14}/> Add Pair</Btn>
        </div>
        <div className="testing-controls">
          <label className="search-box">
            <Icon name="search" size={14} className="text-slate-500" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search pair, model, supplier, compressor, department..." />
            {search && <button type="button" className="search-clear" onClick={() => setSearch("")} aria-label="Clear search">×</button>}
          </label>
          <Field label="Sort by">
            <select className={inputCls} value={sortBy} onChange={e => setSortBy(e.target.value)}>
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="id">Pair ID A–Z</option>
              <option value="model">Model A–Z</option>
              <option value="supplier">Supplier A–Z</option>
              <option value="department">Department</option>
              <option value="status">Status</option>
              <option value="outcome">Outcome</option>
            </select>
          </Field>
          <div className="results-count"><b>{visiblePairs.length}</b> of {pairsEnriched.length} pair{pairsEnriched.length === 1 ? "" : "s"}</div>
        </div>
        {testingFilter !== "all" && (
          <div className="mt-3 flex items-center gap-2">
            <span className="text-[11px] uppercase tracking-wider text-slate-500">Dashboard filter</span>
            <span className="inline-flex items-center gap-2 rounded-full bg-sky-50 border border-sky-200 px-3 py-1 text-xs font-medium text-sky-700">{filterLabels[testingFilter]}
              <button type="button" onClick={onClearTestingFilter} className="text-sky-500 hover:text-sky-800" title="Clear dashboard filter">×</button>
            </span>
          </div>
        )}
      </div>

      {visiblePairs.length === 0 && (
        <div className="text-sm text-slate-500 border border-dashed border-slate-800 rounded-sm p-6 text-center">
          {pairsEnriched.length === 0 ? "No pairs yet — click Add Pair to register one." : "No pairs match your search."}
        </div>
      )}

      <div className="space-y-2">
        {visiblePairs.map(p => (
          <PairRow key={p.id} pair={p} model={modelsById[p.modelId]} supplier={suppliersById[p.supplierId]} compressor={compressorsById[p.compressorId]}
            expanded={expandedPair === p.id} onToggle={() => setExpandedPair(expandedPair === p.id ? null : p.id)}
            addAttempt={addAttempt} deletePair={deletePair} updatePairStatus={updatePairStatus} />
        ))}
      </div>

      {addOpen && (
        <div className="modal-backdrop" onMouseDown={e => { if (e.target === e.currentTarget) setAddOpen(false); }}>
          <div className="add-pair-modal" role="dialog" aria-modal="true" aria-labelledby="add-pair-title">
            <div className="add-pair-modal__header">
              <div>
                <div id="add-pair-title" className="text-base font-semibold text-slate-100">Add New Pair</div>
                <div className="text-xs text-slate-500 mt-0.5">Select the unit, supplier, compressor and owning department.</div>
              </div>
              <button type="button" className="modal-close" onClick={() => setAddOpen(false)} aria-label="Close">×</button>
            </div>
            <div className="add-pair-modal__body">
              <div className="add-pair-grid">
                <Field label="Model *">
                  <select className={inputCls} value={newModel} onChange={e => setNewModel(e.target.value)}>{data.models.map(m => <option key={m.id} value={m.id}>{m.id} — {m.name}</option>)}</select>
                </Field>
                <Field label="Supplier *">
                  <select className={inputCls} value={newSupplier} onChange={e => setNewSupplier(e.target.value)}>{data.suppliers.map(s => <option key={s.id} value={s.id}>{s.id} — {s.name}</option>)}</select>
                </Field>
                <Field label="Compressor Lot *">
                  <select className={inputCls} value={newCompressor} onChange={e => setNewCompressor(e.target.value)}>{data.compressors.map(c => <option key={c.id} value={c.id}>{c.id} — {c.spec}</option>)}</select>
                </Field>
                <Field label="Department *">
                  <select className={inputCls} value={newDepartment} onChange={e => setNewDepartment(e.target.value)}>
                    <option value="Development">Development</option>
                    <option value="Quality">Quality</option>
                  </select>
                </Field>
                <Field label="Target Test Date">
                  <input className={inputCls} type="date" value={newTargetDate} onChange={e => setNewTargetDate(e.target.value)} />
                </Field>
              </div>
              <div className="mt-3">
                <Field label="Pair Note">
                  <textarea className={inputCls + " w-full min-h-[80px]"} value={newPairNote} onChange={e => setNewPairNote(e.target.value)}
                    placeholder="Why is this pair being created? What should the tester or Quality team keep in mind?" />
                </Field>
              </div>
              <div className="mt-3">
                <Field label="Planning Note (what to do when the target date arrives)">
                  <textarea className={inputCls + " w-full min-h-[80px]"} value={newPlanningNote} onChange={e => setNewPlanningNote(e.target.value)}
                    placeholder="e.g. Run 24h load test with 73g R600a; check suction and discharge temperatures." />
                </Field>
              </div>
              <div className="add-pair-preview">
                <div className="text-[10px] uppercase tracking-wider text-slate-500">Pair preview</div>
                <div className="font-mono text-sm text-slate-200 mt-1">{newModel || "—"}_{newSupplier || "—"}_{newCompressor || "—"}</div>
                <Pill className={newDepartment === "Quality" ? "text-amber-300 bg-amber-950/40 border-amber-700" : "text-sky-300 bg-sky-950/40 border-sky-700"}>{newDepartment}</Pill>
              </div>
            </div>
            <div className="add-pair-modal__footer">
              <Btn variant="ghost" onClick={() => setAddOpen(false)}>Cancel</Btn>
              <Btn onClick={submitNewPair}><Icon name="plus" size={14}/> Add Pair</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PairRow({ pair, model, supplier, compressor, expanded, onToggle, addAttempt, deletePair, updatePairStatus }) {
  const [pdMeasured, setPdMeasured] = useState("");
  const [pdTf35, setPdTf35] = useState("");
  const [pdTr35, setPdTr35] = useState("");
  const [pdSuction35, setPdSuction35] = useState("");
  const [pdTf24, setPdTf24] = useState("");
  const [pdTr24, setPdTr24] = useState("");
  const [pdSuction24, setPdSuction24] = useState("");
  const [pdGasCharge, setPdGasCharge] = useState("");
  const [pdTestId, setPdTestId] = useState("");
  const [pdTester, setPdTester] = useState("");
  const [pdNotes, setPdNotes] = useState("");

  const [thTestId, setThTestId] = useState("");
  const [thTester, setThTester] = useState("");
  const [thNotes, setThNotes] = useState("");
  const [thGasCharge, setThGasCharge] = useState("");
  const [thPos, setThPos] = useState({
    min: { cutIn: "", cutOut: "" },
    p3: { cutIn: "", cutOut: "" },
    p5: { cutIn: "", cutOut: "" },
    max: { cutIn: "", cutOut: "" },
  });

  const setPosition = (key, field, value) => setThPos(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));

  const submitPd = () => {
    if (pdGasCharge === "") {
      alert("Current gas charge is required before logging the Pull-Down test.");
      return;
    }
    if (pdMeasured === "" && [pdTf35,pdTr35,pdSuction35,pdTf24,pdTr24,pdSuction24].every(v => v === "")) return;
    addAttempt(pair.id, "pulldown", {
      id: uid("a"), testId: pdTestId.trim(), date: new Date().toISOString().slice(0, 10), measured: pdMeasured === "" ? "" : Number(pdMeasured),
      at3_5h: { Tf: pdTf35 === "" ? "" : Number(pdTf35), Tr: pdTr35 === "" ? "" : Number(pdTr35), suction: pdSuction35 === "" ? "" : Number(pdSuction35) },
      at24h: { Tf: pdTf24 === "" ? "" : Number(pdTf24), Tr: pdTr24 === "" ? "" : Number(pdTr24), suction: pdSuction24 === "" ? "" : Number(pdSuction24) },
      gasCharge: Number(pdGasCharge), tester: pdTester || "—", notes: pdNotes.trim()
    });
    setPdMeasured(""); setPdTf35(""); setPdTr35(""); setPdSuction35(""); setPdTf24(""); setPdTr24(""); setPdSuction24(""); setPdGasCharge(""); setPdTestId(""); setPdTester(""); setPdNotes("");
  };

  const submitTh = () => {
    if (thGasCharge === "") {
      alert("Current gas charge is required before logging the Thermostat test.");
      return;
    }
    const complete = ["min","p3","p5","max"].every(k => thPos[k].cutIn !== "" && thPos[k].cutOut !== "");
    if (!complete) return;
    addAttempt(pair.id, "thermostat", { id: uid("a"), testId: thTestId.trim(), date: new Date().toISOString().slice(0, 10), positions: {
      min: { cutIn: Number(thPos.min.cutIn), cutOut: Number(thPos.min.cutOut) },
      p3: { cutIn: Number(thPos.p3.cutIn), cutOut: Number(thPos.p3.cutOut) },
      p5: { cutIn: Number(thPos.p5.cutIn), cutOut: Number(thPos.p5.cutOut) },
      max: { cutIn: Number(thPos.max.cutIn), cutOut: Number(thPos.max.cutOut) },
    }, gasCharge: Number(thGasCharge), tester: thTester || "—", notes: thNotes.trim() });
    setThPos({ min:{cutIn:"",cutOut:""}, p3:{cutIn:"",cutOut:""}, p5:{cutIn:"",cutOut:""}, max:{cutIn:"",cutOut:""} }); setThGasCharge(""); setThTestId(""); setThTester(""); setThNotes("");
  };

  const submitQuality = () => updatePairStatus(pair.id, { qualityStatus: "Submitted to Quality", submittedDate: new Date().toISOString().slice(0, 10) });

  const pdDisplay = a => {
    const t35 = a.at3_5h ? `3.5h Tf ${a.at3_5h.Tf}° / Tr ${a.at3_5h.Tr}° / Suc ${a.at3_5h.suction}°` : "3.5h —";
    const t24 = a.at24h ? `24h Tf ${a.at24h.Tf}° / Tr ${a.at24h.Tr}° / Suc ${a.at24h.suction}°` : "24h —";
    const charge = a.gasCharge !== undefined && a.gasCharge !== "" ? `${a.gasCharge} g` : "—";
    const testId = a.testId || "—";
    return <div className="log-row__main"><div className="log-row__value">{a.measured !== "" && a.measured !== undefined ? `${a.measured} min · ` : ""}{t35} · {t24}</div><div className="log-row__meta"><span>Test ID: <b>{testId}</b></span><span>Charge: <b className="text-amber-300">{charge}</b></span><span>Tester: {a.tester}</span><span>{a.date}</span></div><div className="log-row__note"><b>Note:</b> {a.notes || "No note added."}</div></div>;
  };

  const thDisplay = a => {
    if (a.positions) return (
      <div className="log-row__main">
        <div className="thermo-log-comparison">
          {THERMO_POSITION_DEFS.map(([key,label]) => {
            const measured = a.positions[key];
            const target = thermoTargetFor(model, key);
            const result = thermoPositionStatus(model, a, key);
            return (
              <div className="thermo-log-position" key={key}>
                <div className="thermo-log-position__name">{label}</div>
                <div className="thermo-log-position__reading">Actual {measured.cutIn}/{measured.cutOut}°</div>
                <div className="thermo-log-position__target">{target ? `Target ${target.cutIn}/${target.cutOut}° ± ${model.thermoTolerance}°` : "Target not configured"}</div>
                {result && <span className={`thermo-log-result ${result === "Pass" ? "pass" : "fail"}`}>{result}</span>}
              </div>
            );
          })}
        </div>
        <div className="log-row__meta"><span>Test ID: <b>{a.testId || "—"}</b></span><span>Charge: <b className="text-amber-300">{a.gasCharge !== undefined && a.gasCharge !== "" ? `${a.gasCharge} g` : "—"}</b></span><span>Tester: {a.tester}</span><span>{a.date}</span></div>
        <div className="log-row__note"><b>Note:</b> {a.notes || "No note added."}</div>
      </div>
    );
    return <div className="log-row__main"><div className="log-row__value">in {a.cutIn}° / out {a.cutOut}°</div><div className="log-row__meta"><span>Test ID: <b>{a.testId || "—"}</b></span><span>Charge: <b className="text-amber-300">{a.gasCharge !== undefined && a.gasCharge !== "" ? `${a.gasCharge} g` : "—"}</b></span><span>Tester: {a.tester}</span><span>{a.date}</span></div><div className="log-row__note"><b>Note:</b> {a.notes || "No note added."}</div></div>;
  };

  const pdReady = pdGasCharge !== "";
  const thReady = thGasCharge !== "" && ["min","p3","p5","max"].every(k => thPos[k].cutIn !== "" && thPos[k].cutOut !== "");

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-sm overflow-hidden">
      <button onClick={onToggle} className="w-full flex items-center justify-between px-4 py-3 hover:bg-slate-850 text-left">
        <div className="flex items-center gap-3">
          <Icon name={expanded ? "chevronDown" : "chevronRight"} size={16} className="text-slate-500" />
          <div className="min-w-0">
            <div className="text-sm font-mono text-slate-200">{pair.id}</div>
            <div className="text-xs text-slate-500">{model?.name} · {supplier?.name} · {compressor?.spec}</div>
            <div className="mt-1 flex items-center gap-2 flex-wrap">
              <Pill className={pair.department === "Quality" ? "text-amber-300 bg-amber-950/40 border-amber-700" : "text-sky-300 bg-sky-950/40 border-sky-700"}>{pair.department || "Development"}</Pill>
            </div>
            {pair.note && <div className="pair-header-note"><b>Pair note:</b> {pair.note}</div>}
          </div>
        </div>
        <div className="flex items-center gap-4"><GaugeBadge status={pair.pullDownStatus} label="Pull-Down" /><GaugeBadge status={pair.thermostatStatus} label="Thermostat" /><Pill className={qStatusColor[pair.qualityStatus]}>{pair.qualityStatus}</Pill></div>
      </button>
      {expanded && (
        <div className="border-t border-slate-800 p-4 space-y-4 bg-slate-950/50">
          <div className="grid md:grid-cols-2 gap-4">
            <section className="test-panel">
              <div className="test-panel__header">
                <div><div className="test-panel__title"><Icon name="timer" size={15} className="text-sky-400"/> Pull-Down Test</div><div className="test-panel__subtitle">Record pull-down time plus temperatures at 3.5 h and 24 h.</div></div>
                <span className="text-[10px] text-slate-500">Target ≤ {model ? model.pullDownTargetMin + model.pullDownToleranceMin : "—"} min</span>
              </div>
              <div className="test-panel__body">
                <div className="entry-requirements"><span className="req-icon">!</span><span><strong>* Current gas charge is mandatory.</strong> Enter the actual charge present in the unit before logging this Pull-Down record. The Log button stays disabled until charge is entered.</span></div>

                <div className="measurement-block test-id-card">
                  <Field label="Test ID"><input className={inputCls} value={pdTestId} onChange={e=>setPdTestId(e.target.value)} placeholder="e.g. PD-2026-001" /></Field>
                </div>

                <div className="gas-charge-card">
                  <Field label={<span>Current Gas Charge (g) <span className="required-mark">*</span></span>}>
                    <input className={inputCls} required type="number" min="0" step="0.1" value={pdGasCharge} onChange={e=>setPdGasCharge(e.target.value)} placeholder="e.g. 45" />
                    <div className="gas-copy">Required for every Pull-Down log</div>
                  </Field>
                  <div className="gas-unit">GRAMS (g)</div>
                </div>

                <div className="test-history"><div className="test-history__label"><span>Previous Pull-Down Logs</span><span>{pair.pullDownAttempts?.length || 0} record(s)</span></div><AttemptHistory attempts={pair.pullDownAttempts} render={a => pdDisplay(a)} /></div>

                <div className="measurement-block">
                  <div className="measurement-block__title"><Icon name="clock" size={13}/> 3.5 Hours</div>
                  <div className="measurement-grid">
                    <Field label="Tf °C"><input className={inputCls} type="number" step="0.1" value={pdTf35} onChange={e=>setPdTf35(e.target.value)} placeholder="e.g. -18.2" /></Field>
                    <Field label="Tr °C"><input className={inputCls} type="number" step="0.1" value={pdTr35} onChange={e=>setPdTr35(e.target.value)} placeholder="e.g. 3.1" /></Field>
                    <Field label="Suction °C"><input className={inputCls} type="number" step="0.1" value={pdSuction35} onChange={e=>setPdSuction35(e.target.value)} placeholder="e.g. 34.5" /></Field>
                  </div>
                </div>

                <div className="measurement-block">
                  <div className="measurement-block__title"><Icon name="clock" size={13}/> 24 Hours</div>
                  <div className="measurement-grid">
                    <Field label="Tf °C"><input className={inputCls} type="number" step="0.1" value={pdTf24} onChange={e=>setPdTf24(e.target.value)} placeholder="e.g. -20.1" /></Field>
                    <Field label="Tr °C"><input className={inputCls} type="number" step="0.1" value={pdTr24} onChange={e=>setPdTr24(e.target.value)} placeholder="e.g. 3.8" /></Field>
                    <Field label="Suction °C"><input className={inputCls} type="number" step="0.1" value={pdSuction24} onChange={e=>setPdSuction24(e.target.value)} placeholder="e.g. 32.7" /></Field>
                  </div>
                </div>

                <div className="log-footer">
                  <Field label="Pull-Down Time (min)"><input className={inputCls} type="number" step="0.1" value={pdMeasured} onChange={e=>setPdMeasured(e.target.value)} placeholder="e.g. 84" /></Field>
                  <Field label="Tester"><input className={inputCls} value={pdTester} onChange={e=>setPdTester(e.target.value)} placeholder="Name" /></Field>
                  <div></div>
                  <div className="log-action"><Btn onClick={submitPd} disabled={!pdReady}><Icon name="plus" size={13}/> Log Pull-Down</Btn>{!pdReady && <div className="inline-disabled-note">* Enter gas charge to enable</div>}</div>
                </div>
                <div className="notes-block"><div className="note-label"><span className="text-[11px] uppercase tracking-wider text-slate-400">Test Note</span><span className="note-hint">Optional — saved with this log</span></div><textarea className={`${inputCls} w-full`} rows="2" value={pdNotes} onChange={e=>setPdNotes(e.target.value)} placeholder="Record observations, abnormal readings, ambient conditions, compressor behavior, etc." /></div>
              </div>
            </section>

            <section className="test-panel">
              <div className="test-panel__header">
                <div><div className="test-panel__title"><Icon name="thermometer" size={15} className="text-teal-400"/> Thermostat Test</div><div className="test-panel__subtitle">Enter Cut-In / Cut-Out at all four thermostat positions.</div></div>
                <span className="text-[10px] text-slate-500">4 positions required</span>
              </div>
              <div className="test-panel__body">
                <div className="thermo-reference">
                  <b>Model thermostat targets:</b>{" "}
                  {model && hasThermoPositionTargets(model)
                    ? THERMO_POSITION_DEFS.map(([key,label]) => {
                        const t = model.thermoPositions[key];
                        return `${label} ${t.cutIn}/${t.cutOut}°`;
                      }).join(" · ") + ` · ± ${model.thermoTolerance}°`
                    : "Four-position targets are not configured for this model."}
                </div>
                <div className="entry-requirements"><span className="req-icon">!</span><span><strong>* Current gas charge is mandatory.</strong> Enter the actual charge present in the unit before logging this Thermostat record.</span></div>

                <div className="measurement-block test-id-card">
                  <Field label="Test ID"><input className={inputCls} value={thTestId} onChange={e=>setThTestId(e.target.value)} placeholder="e.g. TH-2026-001" /></Field>
                </div>

                <div className="gas-charge-card">
                  <Field label={<span>Current Gas Charge (g) <span className="required-mark">*</span></span>}>
                    <input className={inputCls} required type="number" min="0" step="0.1" value={thGasCharge} onChange={e=>setThGasCharge(e.target.value)} placeholder="e.g. 45" />
                    <div className="gas-copy">Required for every Thermostat log</div>
                  </Field>
                  <div className="gas-unit">GRAMS (g)</div>
                </div>

                <div className="test-history"><div className="test-history__label"><span>Previous Thermostat Logs</span><span>{pair.thermostatAttempts?.length || 0} record(s)</span></div><AttemptHistory attempts={pair.thermostatAttempts} render={a => thDisplay(a)} /></div>

                <div className="position-grid">
                  {THERMO_POSITION_DEFS.map(([key,label]) => (
                    <div key={key} className="position-card">
                      <div className="position-card__title">
                        <span>{label}</span>
                        <span className="position-card__target">
                          {(() => {
                            const t = thermoTargetFor(model, key);
                            return t ? `Target ${t.cutIn}/${t.cutOut}° ± ${model.thermoTolerance}°` : "Target not set";
                          })()}
                        </span>
                      </div>
                      <div className="position-grid__fields">
                        <Field label="Cut-In °C"><input className={inputCls} type="number" step="0.1" value={thPos[key].cutIn} onChange={e=>setPosition(key,'cutIn',e.target.value)} placeholder="In" /></Field>
                        <Field label="Cut-Out °C"><input className={inputCls} type="number" step="0.1" value={thPos[key].cutOut} onChange={e=>setPosition(key,'cutOut',e.target.value)} placeholder="Out" /></Field>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="test-action-row">
                  <div className="test-action-row__fields">
                    <Field label="Tester"><input className={inputCls} value={thTester} onChange={e=>setThTester(e.target.value)} placeholder="Name" /></Field>
                    <div></div>
                  </div>
                  <div><Btn onClick={submitTh} disabled={!thReady}><Icon name="plus" size={13}/> Log Thermostat</Btn>{!thReady && <div className="inline-disabled-note">* Gas charge + all 4 positions required</div>}</div>
                </div>
                <div className="notes-block"><div className="note-label"><span className="text-[11px] uppercase tracking-wider text-slate-400">Test Note</span><span className="note-hint">Optional — saved with this log</span></div><textarea className={`${inputCls} w-full`} rows="2" value={thNotes} onChange={e=>setThNotes(e.target.value)} placeholder="Record cycling behavior, drift, stability, unusual cut-in/cut-out, etc." /></div>
              </div>
            </section>
          </div>

          <div className="flex items-center justify-between pt-2 border-t border-slate-800">
            <div className="text-xs text-slate-500">Outcome: <span className="text-slate-300 font-medium">{pair.outcome}</span></div>
            <div className="flex gap-2">
              {pair.qualityStatus !== "Submitted to Quality" && pair.qualityStatus !== "Approved" && <Btn variant="subtle" onClick={submitQuality}><Icon name="tag" size={13}/> Tag for Quality</Btn>}
              <Btn variant="danger" onClick={() => deletePair(pair.id)}><Icon name="trash" size={13}/> Remove Pair</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
function AttemptHistory({ attempts, render }) {
  if (!attempts || attempts.length === 0) return <div className="test-history__empty">No test records logged yet.</div>;
  return (
    <div>
      {attempts.map((a, i) => (
        <div key={a.id} className="log-row">
          <div className="log-row__top"><span className="log-row__number">#{i + 1}</span>{render(a)}</div>
        </div>
      ))}
    </div>
  );
}

function Quality({ pairsEnriched, modelsById, suppliersById, updatePairStatus }) {
  const relevant = pairsEnriched.filter(p => p.qualityStatus !== "Pending Test");
  const [reviewerDraft, setReviewerDraft] = useState({});
  const [commentDraft, setCommentDraft] = useState({});
  const decide = (pairId, decision) => updatePairStatus(pairId, { qualityStatus: decision, decisionDate: new Date().toISOString().slice(0, 10), reviewer: reviewerDraft[pairId] || "—", comments: commentDraft[pairId] || "" });
  return (
    <div className="space-y-3">
      <div className="text-xs text-slate-500">Pairs can now be tagged for Quality directly from the testing record, regardless of test outcome.</div>
      {relevant.length === 0 && <div className="text-sm text-slate-500 border border-dashed border-slate-800 rounded-sm p-6 text-center">No pairs in the Quality workflow yet. Pairs appear here once testing begins.</div>}
      {relevant.map(p => (
        <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-sm p-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="text-sm font-mono text-slate-200">{p.id}</div>
              <div className="text-xs text-slate-500">{modelsById[p.modelId]?.name} · {suppliersById[p.supplierId]?.name} · <span className="text-slate-400">{p.department || "Development"}</span></div>
            </div>
            <div className="flex items-center gap-4">
              <GaugeBadge status={p.pullDownStatus} label="Pull-Down" />
              <GaugeBadge status={p.thermostatStatus} label="Thermostat" />
              <Pill className={qStatusColor[p.qualityStatus]}>{p.qualityStatus}</Pill>
            </div>
          </div>
          {p.qualityStatus === "Submitted to Quality" && (
            <div className="mt-3 pt-3 border-t border-slate-800 flex flex-wrap items-end gap-2">
              <Field label="Reviewer"><input className={`${inputCls} w-40`} value={reviewerDraft[p.id] || ""} onChange={e => setReviewerDraft({ ...reviewerDraft, [p.id]: e.target.value })} placeholder="Name" /></Field>
              <Field label="Comments"><input className={`${inputCls} w-64`} value={commentDraft[p.id] || ""} onChange={e => setCommentDraft({ ...commentDraft, [p.id]: e.target.value })} placeholder="Optional" /></Field>

function MasterData({ data, addModel, addSupplier, addCompressor, deleteModel, deleteSupplier, deleteCompressor }) {
  // Defensive normalization: old/local/API data may not contain every master-data
  // collection. Master Data must never blank the entire application because of that.
  const models = Array.isArray(data?.models) ? data.models : [];
  const suppliers = Array.isArray(data?.suppliers) ? data.suppliers : [];
  const compressors = Array.isArray(data?.compressors) ? data.compressors : [];

  const emptyPositions = () => ({
    min: { cutIn: "", cutOut: "" },
    p3: { cutIn: "", cutOut: "" },
    p5: { cutIn: "", cutOut: "" },
    max: { cutIn: "", cutOut: "" },
  });

  const [m, setM] = useState(() => ({
    id: "", name: "", category: "Refrigerator",
    pullDownTargetMin: "", pullDownToleranceMin: "",
    thermoTolerance: "",
    thermoPositions: emptyPositions()
  }));
  const [s, setS] = useState({ id: "", name: "" });
  const [c, setC] = useState(() => ({
    id: "", supplierId: suppliers[0]?.id || "", spec: ""
  }));

  const setModelPosition = (key, field, value) => {
    setM(prev => ({
      ...prev,
      thermoPositions: {
        ...(prev.thermoPositions || emptyPositions()),
        [key]: {
          ...((prev.thermoPositions && prev.thermoPositions[key]) || { cutIn: "", cutOut: "" }),
          [field]: value
        }
      }
    }));
  };

  const resetModel = () => setM({
    id: "", name: "", category: "Refrigerator",
    pullDownTargetMin: "", pullDownToleranceMin: "",
    thermoTolerance: "",
    thermoPositions: emptyPositions()
  });

  const addModelFromForm = () => {
    const id = String(m.id || "").trim();
    const name = String(m.name || "").trim();

    if (!id || !name) {
      alert("Model ID and Name are required.");
      return;
    }

    if (m.pullDownTargetMin === "" || m.pullDownToleranceMin === "" || m.thermoTolerance === "") {
      alert("Pull-down target/tolerance and thermostat tolerance are required.");
      return;
    }

    const positions = {};
    for (const [key, label] of THERMO_POSITION_DEFS) {
      const source = (m.thermoPositions && m.thermoPositions[key]) || {};
      if (source.cutIn === "" || source.cutOut === "" ||
          source.cutIn === null || source.cutOut === null ||
          source.cutIn === undefined || source.cutOut === undefined) {
        alert(`Enter both Cut-In and Cut-Out targets for ${label}.`);
        return;
      }
      const cutIn = Number(source.cutIn);
      const cutOut = Number(source.cutOut);
      if (!Number.isFinite(cutIn) || !Number.isFinite(cutOut)) {
        alert(`Enter valid numeric Cut-In and Cut-Out targets for ${label}.`);
        return;
      }
      positions[key] = { cutIn, cutOut };
    }

    addModel({
      id,
      name,
      category: m.category || "Refrigerator",
      pullDownTargetMin: Number(m.pullDownTargetMin),
      pullDownToleranceMin: Number(m.pullDownToleranceMin),
      // Keep these legacy fields synchronized with P# Min for backward compatibility.
      thermoCutIn: positions.min.cutIn,
      thermoCutOut: positions.min.cutOut,
      thermoTolerance: Number(m.thermoTolerance),
      thermoPositions: positions
    });
    resetModel();
  };

  const addSupplierFromForm = () => {
    const id = String(s.id || "").trim();
    const name = String(s.name || "").trim();

    setS({ id: "", name: "" });

  const addCompressorFromForm = () => {

    setC({ id: "", supplierId: suppliers[0]?.id || "", spec: "" });
  };

  return (
    <div className="grid lg:grid-cols-3 gap-5">
      <section className="bg-slate-900 border border-slate-800 rounded-sm p-4">

        <div className="space-y-1 mb-3 max-h-56 overflow-auto">
          {models.map(mm => (
            <div key={mm.id} className="text-xs bg-slate-950 border border-slate-800 rounded-sm px-2 py-2 flex items-center justify-between gap-2">
              <div className="min-w-0">
                <div className="font-mono text-slate-300">{mm.id} — {mm.name}</div>
                <div className="text-slate-500">
                  Pull-down ≤ {Number(mm.pullDownTargetMin || 0) + Number(mm.pullDownToleranceMin || 0)}min ·{" "}
                  {hasThermoPositionTargets(mm)
                    ? "Thermostat targets: Min / 3 / 5 / Max"
                    : `Legacy thermo Min ${mm.thermoCutIn ?? "—"}/${mm.thermoCutOut ?? "—"}°C ± ${mm.thermoTolerance ?? "—"}°`}
                </div>

          )}

        <div className="model-form-section">
          <div className="model-form-grid">
            <input className={inputCls} placeholder="Model ID" value={m.id} onChange={e => setM(prev => ({...prev, id:e.target.value}))}/>
            <input className={inputCls} placeholder="Name" value={m.name} onChange={e => setM(prev => ({...prev, name:e.target.value}))}/>
            <select className={inputCls} value={m.category} onChange={e => setM(prev => ({...prev, category:e.target.value}))}>

            <input className={inputCls} type="number" placeholder="Pull-down target (min)" value={m.pullDownTargetMin} onChange={e => setM(prev => ({...prev, pullDownTargetMin:e.target.value}))}/>
            <input className={inputCls} type="number" placeholder="Pull-down tolerance (min)" value={m.pullDownToleranceMin} onChange={e => setM(prev => ({...prev, pullDownToleranceMin:e.target.value}))}/>
            <input className={inputCls} type="number" step="0.1" placeholder="Thermo tolerance °C" value={m.thermoTolerance} onChange={e => setM(prev => ({...prev, thermoTolerance:e.target.value}))}/>

              <div>
                <div className="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Thermostat position targets</div>

        <div className="grid grid-cols-1 gap-2">

const wsHdr = () => { const h = { "Content-Type": "application/json" }; try { const k = localStorage.getItem("wb-key"); if (k) h["x-access-key"] = k; } catch (e) {} return h; };
async function wsLoad() {
  if (WS_API) {
    const r = await fetch(WS_API + "/state", { cache: "no-store", headers: wsHdr() });
    if (r.status === 401) throw new Error("LOCKED");
    if (r.status === 404) return null;
    if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch (e) {} throw new Error(m || "API " + r.status); }
    return r.json();
  }
  try { const raw = localStorage.getItem(WS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
async function wsSave(s) {
  if (WS_API) {
    const r = await fetch(WS_API + "/state", { method: "PUT", headers: wsHdr(), body: JSON.stringify(s) });
    if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch (e) {} throw new Error(m || "API " + r.status); }

  }
  localStorage.setItem(WS_KEY, JSON.stringify(s));
}

function streakOf(j) {
  const days = new Set(j.map(e => e.date)); let n = 0; const d = new Date();
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function BackupDialog({ st, onRestore, onClose }) {
  const json = JSON.stringify(st, null, 2), [msg, setMsg] = useState(""), [txt, setTxt] = useState(""), [show, setShow] = useState(false), fileRef = useRef(null);
  const download = () => { try { const url = URL.createObjectURL(new Blob([json], { type: "application/json" })); const a = document.createElement("a"); a.href = url; a.download = `workbench-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); setMsg("Download started. If nothing appears, use “Show text” and copy it."); } catch (e) { setShow(true); setMsg("Downloads are blocked here — copy the text below instead."); } };
  const copy = async () => { try { await navigator.clipboard.writeText(json); setMsg("Copied to clipboard."); } catch (e) { setShow(true); setMsg("Select the text below and copy it."); } };
  const restore = raw => { try { const d = JSON.parse(raw); if (!d || typeof d !== "object") throw 0; onRestore(d); } catch (e) { setMsg("That isn't a valid backup."); } };
  const pickFile = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(f); e.target.value = ""; };
  return <Modal title="Backup & restore" sub="Your data lives in this browser. Save a backup to move it to another device." onClose={onClose}>
    <div className="dlg-act" style={{ justifyContent: "flex-start", marginBottom: 10 }}>
      <button className="ws-btn" onClick={download}>Download backup</button><button className="ws-btn ghost" onClick={copy}>Copy</button><button className="ws-btn ghost" onClick={() => setShow(s => !s)}>{show ? "Hide text" : "Show text"}</button></div>
    {show && <textarea readOnly rows={5} value={json} onFocus={e => e.target.select()} style={{ width: "100%", fontSize: 11, fontFamily: "monospace", marginBottom: 10 }} />}
    <div className="ws-sec" style={{ margin: "14px 0 8px" }}>Restore</div>
    <div className="dlg-act" style={{ justifyContent: "flex-start" }}><button className="ws-btn ghost" onClick={() => fileRef.current.click()}>Choose backup file…</button><input ref={fileRef} type="file" accept=".json,application/json" style={{ display: "none" }} onChange={pickFile} /></div>
    <textarea rows={3} placeholder="…or paste backup text here" value={txt} onChange={e => setTxt(e.target.value)} style={{ width: "100%", fontSize: 12, marginTop: 8 }} />
    {txt.trim() && <div className="dlg-act"><button className="ws-btn" onClick={() => restore(txt)}>Restore from text</button></div>}
    {msg && <p className="sub" style={{ marginTop: 10, color: "#0f766e" }}>{msg}</p>}
  </Modal>;
}

        {list.map(p => { const pdr = p.pullDownStatus, thr = p.thermostatStatus, isLate = p.targetDate && p.targetDate < td && ["Planned", "In Progress"].includes(c);
          return <div key={p.id} className="kb-card" draggable onDragStart={e => e.dataTransfer.setData("text/plain", p.id)} onClick={() => setDlg(p)}>
            <div className="kb-title" style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 12 }}>{p.id}</div>
            <div style={{ fontSize: 12, color: "#71717a", marginTop: 3 }}>{p.model?.name || p.modelId} · {p.department || "Development"}</div>
            {p.planningNote && <div style={{ fontSize: 12, color: "#52525b", marginTop: 6 }}>{p.planningNote}</div>}
            <div className="kb-meta">
              <span className={`chip ${pdr === "Pass" ? "low" : pdr === "Fail" ? "high" : ""}`}>Pull-down {pdr || "—"}</span>
              <span className={`chip ${thr === "Pass" ? "low" : thr === "Fail" ? "high" : ""}`}>Thermostat {thr || "—"}</span>
              {p.targetDate && <span className={`chip ${isLate ? "late" : ""}`}>{fmtD(p.targetDate)}{isLate ? " · overdue" : ""}</span>}</div>
            <div className="kb-move" onClick={e => e.stopPropagation()}><button disabled={ci(c) === 0} onClick={() => move(p.id, PLAN_COLS[ci(c) - 1])}>‹</button><button disabled={ci(c) === 4} onClick={() => move(p.id, PLAN_COLS[ci(c) + 1])}>›</button></div>
          </div>; })}
      </div>; })}</div>
    {dlg && <PlanDialog p={dlg} onClose={() => setDlg(null)} onOpen={() => open(dlg.id)} onSave={patch => { upd(dlg.id, patch); setDlg(null); }} />}
  </div>;
}

/* ---------- Reminders (in-app + system notifications) ---------- */
function openDated(st) {
  const out = [];
  st.work.tasks.forEach(t => t.status !== "done" && t.dueDate && out.push({ id: "w" + t.id, title: t.title, sub: "Work task", date: t.dueDate, to: { space: "work", page: "project:" + t.projectId } }));
  st.personal.tasks.forEach(t => t.status !== "done" && t.dueDate && out.push({ id: "p" + t.id, title: t.title, sub: "Personal task", date: t.dueDate, to: { space: "personal", page: "ptasks" } }));
  st.lab.pairs.forEach(p => { const s = planStatus(p); if (p.targetDate && !["Completed", "Cancelled"].includes(s)) out.push({ id: "l" + p.id, title: "Test " + p.id, sub: "Charge Lab", date: p.targetDate, to: { space: "work", page: "lab", pair: p.id } }); });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
async function pushNotify(title, body) {
  try {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) return reg.showNotification(title, { body, tag: "wb-due", icon: "icon-192.png", badge: "icon-192.png" });
    new Notification(title, { body, tag: "wb-due" });
  } catch (e) {}
}

/* ---------- Root shell ---------- */
function Root() {
  const [st, setSt] = useState(null), [err, setErr] = useState(""), [space, setSpace] = useState("work"), [page, setPage] = useState("overview");
  const [labReq, setLabReq] = useState(null), [dlg, setDlg] = useState(null), [toast, setToast] = useState(""), [bell, setBell] = useState(false);
  const [locked, setLocked] = useState(false), [keyIn, setKeyIn] = useState(""), dirty = useRef(false);
  const [perm, setPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported"), ready = useRef(false);
  useEffect(() => {
    window.__toast = m => { setToast(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToast(""), 4500); };
    window.__ask = (msg, fn) => setDlg({ t: "ask", msg, fn });
    window.alert = m => window.__toast(String(m));
  }, []);
  useEffect(() => { (async () => { try { const d = await wsLoad(); setSt(d ? wsNormalize(d) : wsSeed()); ready.current = true; } catch (e) { if (e.message === "LOCKED") setLocked(true); else setErr("Could not load data: " + e.message + (WS_API ? " — check MONGODB_URI in Vercel and visit /api/health" : "")); } })(); }, []);
  useEffect(() => { // pull newer data when you come back to the app (phone <-> web)
    if (!WS_API) return;
    const h = async () => { if (document.visibilityState !== "visible" || dirty.current || !ready.current) return; try { const d = await wsLoad(); if (d) setSt(s => JSON.stringify(wsNormalize(d)) === JSON.stringify(s) ? s : wsNormalize(d)); } catch (e) {} };
    document.addEventListener("visibilitychange", h); return () => document.removeEventListener("visibilitychange", h);
  }, []);
  useEffect(() => { if (!st || !ready.current) return; dirty.current = true; const t = setTimeout(() => wsSave(st).then(() => { dirty.current = false; setErr(""); }).catch(e => setErr("Couldn't save: " + e.message)), 350); return () => clearTimeout(t); }, [st]);
  useEffect(() => { // one-tap permission on first interaction, so no setup step is needed
    if (typeof Notification === "undefined" || Notification.permission !== "default") return;
    const h = () => Notification.requestPermission().then(p => setPerm(p)).catch(() => {});
    window.addEventListener("pointerdown", h, { once: true }); return () => window.removeEventListener("pointerdown", h);
  }, []);
  useEffect(() => { // installable app + background checks (only when hosted over https)
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register("sw.js").then(async reg => { try { if (reg.periodicSync) await reg.periodicSync.register("wb-due", { minInterval: 6 * 3600 * 1000 }); } catch (e) {} }).catch(() => {});
  }, []);
  useEffect(() => {
    if (!st) return;
    const run = () => {
      const td = todayStr(), items = openDated(st);
      let seen; try { seen = JSON.parse(localStorage.getItem("wb-notified") || "{}"); } catch (e) { seen = {}; }
      if (seen.d !== td) seen = { d: td, ids: [] };
      const fresh = items.filter(i => i.date <= td && !seen.ids.includes(i.id));
      if (fresh.length) { pushNotify(fresh.length === 1 ? fresh[0].title : `${fresh.length} items need attention`, fresh.length === 1 ? `${fresh[0].sub} · ${fresh[0].date < td ? "overdue" : "due today"}` : fresh.slice(0, 4).map(i => i.title).join(", ")); seen.ids.push(...fresh.map(i => i.id)); try { localStorage.setItem("wb-notified", JSON.stringify(seen)); } catch (e) {} }
      try { caches.open("wb-data").then(c => { c.put("due.json", new Response(JSON.stringify({ items }))); c.put("notified.json", new Response(JSON.stringify(seen))); }); } catch (e) {}
    };
    run(); const t = setInterval(run, 60000); return () => clearInterval(t);
  }, [st]);
  if (locked) return <div className="dlg-bg" style={{ background: "#fff" }}><div className="dlg" style={{ border: "1px solid #e4e4e7" }}><h3>Workbench is locked</h3><p className="sub">Enter your access key to open your data.</p>
    <input type="password" autoFocus value={keyIn} onChange={e => setKeyIn(e.target.value)} onKeyDown={e => e.key === "Enter" && (localStorage.setItem("wb-key", keyIn), location.reload())} style={{ width: "100%", padding: 10 }} />
    <div className="dlg-act"><button className="ws-btn" onClick={() => { localStorage.setItem("wb-key", keyIn); location.reload(); }}>Unlock</button></div></div></div>;
  if (!st) return <div style={{ padding: 40, color: "#71717a" }}>{err || "Loading…"}</div>;
  const setWork = fn => setSt(s => ({ ...s, work: fn(s.work) })), setPers = fn => setSt(s => ({ ...s, personal: fn(s.personal) })), setLab = fn => setSt(s => ({ ...s, lab: fn(s.lab) }));
  const go = p => { setPage(p); setBell(false); window.scrollTo(0, 0); };
  const switchSpace = s => { setSpace(s); setPage(s === "work" ? "overview" : "today"); };
  const openPair = id => { setSpace("work"); setPage("lab"); setLabReq({ tab: id ? "testing" : "planning", pairId: id, n: Date.now() }); setBell(false); };
  const goItem = it => { if (it.to.pair) return openPair(it.to.pair); setSpace(it.to.space); setPage(it.to.page); setBell(false); };
  const saveProject = f => { if (f.id) setWork(w => ({ ...w, projects: w.projects.map(x => x.id === f.id ? f : x) })); else { const id = uid("pr"); setWork(w => ({ ...w, projects: [...w.projects, { ...f, id }] })); setSpace("work"); setPage("project:" + id); } setDlg(null); };
  const ui = { ask: (msg, fn) => setDlg({ t: "ask", msg, fn }), projectForm: p => setDlg({ t: "project", p: p || null }) };
  const due = openDated(st).filter(i => i.date <= todayStr());
  const NI = ({ id, icon, dot, children }) => <button className={`ni ${page === id ? "on" : ""}`} onClick={() => go(id)}>{dot ? <span className="ws-dot" style={{ background: dot }} /> : <Icon name={icon} size={18} />}{children}</button>;
  const Switch = <div className="ws-switch"><button className={space === "work" ? "on" : ""} onClick={() => switchSpace("work")}>Work</button><button className={space === "personal" ? "on" : ""} onClick={() => switchSpace("personal")}>Personal</button></div>;
  const Bell = <button className="ws-ic" title="Reminders" onClick={() => setBell(b => !b)}><Icon name="bell" size={19} />{due.length > 0 && <i>{due.length}</i>}</button>;
  const view = space === "personal"
    ? (page === "journal" ? <Journal st={st} setPers={setPers} /> : page === "ptasks" ? <PersonalTasks st={st} setPers={setPers} /> : <PersonalToday st={st} setPers={setPers} go={go} />)
    : page === "lab" ? <LabApp data={st.lab} persist={next => setLab(() => next)} req={labReq} />
    : page === "calendar" ? <CalendarPage st={st} go={go} openPair={openPair} />
    : page === "people" ? <PeoplePage st={st} setWork={setWork} />
    : page.startsWith("project:") ? <ProjectPage key={page} st={st} setWork={setWork} pid={page.slice(8)} go={go} />
    : <WorkOverview st={st} go={go} openPair={openPair} />;
  const bn = space === "work" ? [["overview", "home", "Overview"], ["lab", "gauge", "Charge Lab"], ["calendar", "cal", "Calendar"], ["people", "users", "People"]] : [["today", "home", "Today"], ["journal", "book", "Journal"], ["ptasks", "check", "Tasks"]];
  return <UICtx.Provider value={ui}><div className={`ws ${space}`}>
    <aside className="ws-side">
      <div className="ws-brand"><div className="ws-logo"><Icon name="kanban" size={19} /></div><b>Workbench</b>{Bell}</div>
      {Switch}
      <nav className="ws-nav">{space === "work" ? <>
        <NI id="overview" icon="home">Overview</NI>
        <h6>PROJECTS</h6>{st.work.projects.map(p => <NI key={p.id} id={"project:" + p.id} dot={p.color}>{p.name}</NI>)}
        <h6>LAB</h6><NI id="lab" icon="gauge">Charge Verification</NI>
        <h6>PLAN</h6><NI id="calendar" icon="cal">Calendar</NI><NI id="people" icon="users">People</NI>
      </> : <><NI id="today" icon="home">Today</NI><NI id="journal" icon="book">Journal</NI><NI id="ptasks" icon="check">My tasks</NI></>}</nav>
      <div className="ws-foot"><button className="ni" onClick={() => setDlg({ t: "backup" })}><Icon name="dl" size={17} />Backup & restore</button>{WS_API ? "Synced to your server" : "Saved in this browser"}</div>
    </aside>
    <div className="ws-col">
      <header className="ws-top"><b>Workbench</b>{Switch}{Bell}<button className="ws-ic" title="Backup" onClick={() => setDlg({ t: "backup" })}><Icon name="dl" size={18} /></button></header>
      <main className="ws-main">{err && <div className="ws-err">{err}</div>}{view}</main>
      <nav className="ws-bnav">{bn.map(([id, ic, l]) => <button key={id} className={page === id ? "on" : ""} onClick={() => go(id)}><Icon name={ic} size={20} />{l}</button>)}</nav>
    </div>
    {bell && <div className="bell-pop"><h5>Needs attention · {due.length}</h5>
      {due.length ? due.slice(0, 8).map(i => <div key={i.id} className="ws-row" onClick={() => goItem(i)}><span>{i.title}</span><span className={`d ${i.date < todayStr() ? "late" : ""}`}>{i.date < todayStr() ? "Overdue" : "Today"}</span></div>) : <p className="sub" style={{ margin: 0, fontSize: 13, color: "#71717a" }}>Nothing due. You're all caught up.</p>}
      <p style={{ fontSize: 11, color: "#a1a1aa", margin: "10px 0 0" }}>{perm === "granted" ? "System notifications are on." : perm === "denied" ? "Notifications are blocked in your browser settings." : perm === "unsupported" ? "This browser can't show system notifications." : "Click anywhere to allow system notifications."}</p></div>}
    {dlg?.t === "ask" && <ConfirmDialog msg={dlg.msg} onYes={() => { dlg.fn(); setDlg(null); }} onClose={() => setDlg(null)} />}
    {dlg?.t === "project" && <ProjectDialog p={dlg.p} onSave={saveProject} onClose={() => setDlg(null)} />}
    {dlg?.t === "backup" && <BackupDialog st={st} onClose={() => setDlg(null)} onRestore={d => { setSt(wsNormalize(d)); setDlg(null); window.__toast("Backup restored"); }} />}
    {toast && <div className="toast">{toast}</div>}
  </div></UICtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
