<style>
  .test-panel{background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(2,6,23,.96));border:1px solid #1e293b;border-radius:6px;overflow:hidden;}
  .test-panel__header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid #1e293b;background:rgba(15,23,42,.8);}
  .test-panel__title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#e2e8f0;}
  .test-panel__subtitle{font-size:10px;color:#64748b;margin-top:3px;}
  .test-panel__body{padding:14px;}
  .test-history{margin-bottom:14px;}
  .test-history__label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;}
  .test-history__empty{padding:9px 10px;border:1px dashed #334155;border-radius:4px;color:#64748b;font-size:11px;background:rgba(2,6,23,.35);}
  .log-row{display:block;padding:9px 10px;border:1px solid #1e293b;border-radius:4px;background:#0b1220;margin-bottom:6px;}
  .log-row:last-child{margin-bottom:0;}
  .log-row__top{display:flex;align-items:flex-start;gap:9px;}
  .log-row__number{flex:0 0 25px;color:#64748b;font:11px 'IBM Plex Mono',monospace;padding-top:1px;}
  .log-row__main{min-width:0;flex:1;}
  .log-row__value{font:11px/1.55 'IBM Plex Mono',monospace;color:#e2e8f0;word-break:break-word;}
  .log-row__meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:#64748b;}
  .log-row__note{margin-top:7px;padding:6px 8px;border-left:2px solid #334155;background:rgba(15,23,42,.7);font-size:10px;line-height:1.45;color:#94a3b8;}
  .measurement-block{border:1px solid #1e293b;border-radius:5px;background:rgba(15,23,42,.48);padding:11px;margin-bottom:10px;}
  .measurement-block__title{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7dd3fc;margin-bottom:9px;}
  .measurement-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .position-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
  .position-card{border:1px solid #1e293b;border-radius:5px;background:#0b1220;padding:10px;}
  .position-card__title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5eead4;}
  .position-card__target{font-size:9px;color:#64748b;font-weight:500;letter-spacing:0;text-transform:none;}
  .position-grid__fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .log-footer{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:9px;align-items:end;margin-top:10px;padding-top:11px;border-top:1px solid #1e293b;}
  .required-field input{border-color:#7f1d1d;}
  .required-field input:focus{border-color:#ef4444;box-shadow:0 0 0 1px rgba(239,68,68,.25);}
  .required-mark{color:#fb7185;font-weight:700;}
  .required-hint{font-size:9px;color:#64748b;margin-top:5px;}
  .gas-field{background:rgba(120,53,15,.14);border:1px solid #713f12;border-radius:5px;padding:7px;}
  .gas-field input{background:#020617;border-color:#92400e;}

.ws.personal{--pri:#6d28d9;--pri-soft:rgba(109,40,217,.09)}
.ws-side{width:256px;flex:0 0 256px;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.ws-brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;border-bottom:1px solid var(--bd)}
.ws-logo{width:36px;height:36px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.ws-brand b{font:700 18px 'Inter',sans-serif;flex:1}
.ws-ic{width:36px;height:36px;border:0;background:none;border-radius:9px;color:var(--mut);cursor:pointer;display:grid;place-items:center;position:relative}
.ws-ic:hover{background:var(--mbg);color:var(--fg)}
.ws-ic i{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font:600 10px/16px 'Inter';text-align:center;font-style:normal;padding:0 4px}
.ws-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--mbg);border-radius:10px;padding:3px;margin:12px 12px 4px}
.ws-switch button{border:0;background:none;padding:7px;border-radius:8px;font:500 13px 'Inter';color:var(--mut);cursor:pointer}
.ws-switch button.on{background:var(--card);color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ws-nav{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.ws-nav h6{margin:14px 12px 4px;font:600 11px 'Inter';color:#a1a1aa}
.ni{display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 12px;border:0;background:none;border-radius:8px;font:500 14px 'Inter';color:var(--mut);cursor:pointer;text-align:left;width:100%}
.ni:hover{background:var(--mbg);color:var(--fg)}
.ni.on{background:var(--pri-soft);color:var(--pri)}
.ni .ws-dot{margin:0 3px}
.ws-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;display:inline-block}
.ws-foot{border-top:1px solid var(--bd);padding:12px;font-size:11px;color:#a1a1aa}
.ws-foot .ni{min-height:36px}
.ws-col{flex:1;min-width:0;display:flex;flex-direction:column}
.ws-top,.ws-bnav{display:none}
.ws-main{flex:1;padding:32px;max-width:1240px;width:100%}
.ws-err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.ws-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.ws-h h2{margin:0;font:700 28px 'Inter';letter-spacing:-.02em;display:flex;align-items:center}
.ws-h p{margin:4px 0 0;color:var(--mut);font-size:14px}
.ws-act{display:flex;gap:8px;flex-wrap:wrap}
.ws-btn{border:1px solid var(--pri);background:var(--pri);color:var(--pri-fg);border-radius:8px;min-height:40px;padding:0 16px;font:500 14px 'Inter';cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.ws-btn:hover{opacity:.9}
.ws-btn.ghost{background:var(--card);color:var(--fg);border-color:var(--bd)}.ws-btn.ghost:hover{background:var(--mbg)}
.ws-btn.danger{background:var(--card);color:#dc2626;border-color:#fecaca}.ws-btn.danger:hover{background:#fef2f2}
.ws-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:28px}
.ws-kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.ws-kpi b{display:block;font:700 28px 'Inter';letter-spacing:-.02em}
.ws-kpi span{font-size:13px;color:var(--mut)}
.ws-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ws-proj{cursor:pointer;transition:box-shadow .15s}.ws-proj:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.ws-proj .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ws-proj h4{margin:0;font:600 16px 'Inter'}
.ws-proj p{margin:0 0 14px;font-size:13px;color:var(--mut);min-height:18px}
.ws-bar{height:6px;background:var(--mbg);border-radius:6px;overflow:hidden}
.ws-bar i{display:block;height:100%;background:var(--c,var(--pri))}
.ws-sec{margin:28px 0 12px;font:600 15px 'Inter'}
.ws-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--mbg);font-size:14px;cursor:pointer}
.ws-row:last-child{border:0}
.ws-row .d{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.ws-row .d.late{color:#dc2626;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px 'Inter';padding:2px 8px;border-radius:999px;background:var(--mbg);color:var(--fg2)}
.chip.high{background:#fef2f2;color:#dc2626}.chip.medium{background:#fffbeb;color:#b45309}.chip.low{background:#f0fdf4;color:#15803d}
.chip.late{background:#fef2f2;color:#dc2626}.chip.lab{background:#f0fdfa;color:#0f766e}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.kb-col{background:var(--mbg);border-radius:16px;padding:12px;min-height:150px;border:2px solid transparent}
.kb-col.over{border-color:var(--pri)}
.kb-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;font:600 13px 'Inter'}
.kb-head i{font-style:normal;background:var(--card);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut);font-weight:500}
.kb-card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--bd);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kb-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.kb-card.done .kb-title{text-decoration:line-through;color:#a1a1aa}
.kb-title{font:500 14px/1.35 'Inter'}
.kb-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.kb-move{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.kb-move button{border:1px solid var(--bd);background:var(--card);border-radius:8px;width:36px;height:32px;cursor:pointer;color:var(--fg2);font-size:16px}
.kb-move button:disabled{opacity:.3}
@media(hover:hover){.kb-move{display:none}}
.kb-add{width:100%;border:1px dashed #d4d4d8!important;background:transparent!important;padding:10px;font:14px 'Inter'}
/* modal */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:var(--card);border-radius:14px;width:min(500px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 4px;font:600 18px 'Inter'}.dlg .sub{margin:0 0 16px;font-size:13px;color:var(--mut)}
.fld{display:block;margin-bottom:14px}.fld>span{display:block;font:500 13px 'Inter';margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font:13px 'Inter';cursor:pointer}
.pick button.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.sw{width:34px!important;height:34px;border-radius:50%!important;padding:0!important;border:3px solid var(--card)!important;outline:2px solid transparent}
.sw.on{outline-color:var(--c)}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;max-width:90vw}
.bell-pop{position:fixed;z-index:70;top:60px;left:12px;width:min(340px,calc(100vw - 24px));background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px}
.bell-pop h5{margin:0 0 8px;font:600 14px 'Inter'}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.cal .h{background:var(--mbg);text-align:center;font:500 12px 'Inter';color:var(--mut);padding:8px}
.cal .c{background:var(--card);min-height:100px;padding:6px;font-size:11px;min-width:0}
.cal .c.o{background:var(--sub);color:#a1a1aa}.cal .c.t{background:var(--pri-soft)}
.cal .c b{font:600 12px 'Inter'}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c,#18181b);background:var(--mbg);border-radius:4px;padding:2px 5px;margin-top:3px;font:11px 'Inter';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.lab{--c:#0f766e;background:#f0fdfa;color:#0f766e}
/* journal */
.jr{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.jr-list{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.jr-item{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.jr-item.on{border-color:var(--pri);background:var(--pri-soft)}
.jr-item b{display:block;font:500 14px 'Inter'}.jr-item span{font-size:12px;color:var(--mut)}
.jr-ed{padding:24px 28px}
.jr-ed .ttl{border:0!important;box-shadow:none!important;font:600 28px 'Lora',Georgia,serif!important;padding:0!important;width:100%;background:transparent!important}
.jr-ed .body{border:0!important;box-shadow:none!important;font:17px/1.75 'Lora',Georgia,serif!important;width:100%;min-height:320px;padding:8px 0!important;resize:vertical;background:transparent!important}
.mood{display:flex;gap:4px}
.mood button{border:1px solid transparent;background:var(--mbg);border-radius:10px;font-size:20px;padding:3px 8px;cursor:pointer;opacity:.5}
.mood button.on{opacity:1;border-color:var(--pri);background:var(--card)}
.strip{display:flex;gap:6px}.strip span{width:40px;height:40px;border-radius:10px;background:var(--mbg);display:grid;place-items:center;font-size:19px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid #d4d4d8;background:var(--card);cursor:pointer;flex:0 0 20px}
/* embedded Charge Lab: neutralise its old look so it matches the app */
.ws-main .min-h-screen{padding:0!important;min-height:0!important;background:transparent!important}
.ws-main .min-h-screen>.max-w-7xl{max-width:none!important}
.ws-main .min-h-screen>.max-w-7xl>div.bg-slate-950{box-shadow:none!important;border-radius:12px!important;border:1px solid var(--bd)!important}
.ws-main .min-h-screen .bg-slate-950>.bg-slate-900:first-child{background:var(--card)!important;border-radius:12px 12px 0 0!important}
.ws-main .min-h-screen nav{background:var(--mbg)!important;border:0!important}
.ws-main .min-h-screen nav button.bg-teal-600{background:#18181b!important;box-shadow:none!important}
.ws-main .kpi-card{background:var(--card)!important;border:1px solid var(--bd)!important;border-radius:12px!important;color:var(--fg)!important;min-height:0!important;box-shadow:none!important}
.ws-main .kpi-card__value,.ws-main .kpi-card__label{color:var(--fg)!important}
.ws-main .kpi-card__glow{display:none!important}.ws-main .kpi-card__arrow{background:var(--mbg)!important}
.ws-main .kpi-card:hover{transform:none!important;box-shadow:0 3px 10px rgba(0,0,0,.08)!important}
@media(max-width:860px){
 .ws-side{display:none}
 .ws-top{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:30}
 .ws-top b{font:700 16px 'Inter';flex:1}
 .ws-top .ws-switch{margin:0;width:150px}
 .ws-bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
 .ws-bnav button{flex:1 1 0;min-width:0;min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:11px 'Inter';color:var(--mut)}
 .ws-bnav button span{font:500 11px 'Inter';white-space:nowrap}
 .ws-bnav button.on{color:var(--pri);font-weight:600}
 .ws-main{padding:18px 14px 90px}.ws-h h2{font-size:24px}
 .ws-kpis{grid-template-columns:1fr 1fr 1fr}.ws-kpi{padding:12px}.ws-kpi b{font-size:22px}
 .jr{grid-template-columns:1fr}.jr-list{max-height:190px}
 .cal .c{min-height:64px}.ev{font-size:9px}
 .bell-pop{top:56px}
}
/* v3: focus, budget, reading */
.fc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.fc-main{text-align:left}.fdial{display:block;width:min(260px,70vw);margin:14px auto}
.forest{display:flex;flex-wrap:wrap;gap:4px;font-size:24px;min-height:34px;margin-bottom:12px}
.wk{display:flex;gap:8px;align-items:flex-end;height:96px;margin-bottom:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wk i{display:block;width:100%;max-width:34px;background:var(--pri);border-radius:6px 6px 2px 2px;opacity:.85}
.wk span{font:11px 'Inter';color:#a1a1aa}
.cat{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:9px 0;font-size:14px;cursor:pointer}
.cat em{font-style:normal;font-size:12px;white-space:nowrap}
@media(max-width:860px){.fc{grid-template-columns:1fr}.cat{grid-template-columns:110px 1fr auto;font-size:13px}.ws-bnav button span{font-size:10px}}
/* ===== Charge Lab: pair test panels (redesigned, consistent) ===== */
.ws-btn:disabled{opacity:.4;cursor:not-allowed}
/* budget graphs + focus dial */
button.ws-kpi{font-family:inherit;text-align:left;width:100%;cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.ws-kpi:hover{border-color:#a1a1aa}
button.ws-kpi.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.chart{margin-bottom:24px}.chart-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.chart-h h4{margin:0;font:600 16px 'Inter'}.chart-h p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.chart h5{margin:0 0 10px;font:600 13px 'Inter';color:var(--fg2)}
.chart-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px;align-items:start}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.donut svg{flex:0 0 170px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:130px;font-size:13px}
.legend>div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}.legend span{flex:1}.legend b{font-weight:600}
.legend.row{flex-direction:row;gap:16px;margin-top:8px;min-width:0}.legend.row span{flex:0}
.bars{width:100%;height:auto;display:block}
.hb{display:flex;flex-direction:column;gap:8px}.hb>div{display:grid;grid-template-columns:36px 1fr 96px;gap:10px;align-items:center;font-size:13px}.hb b{text-align:right;font-size:12px}
.fdial,.fdial *{outline:none!important;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.fdial{cursor:pointer;touch-action:manipulation}.fc-main{-webkit-tap-highlight-color:transparent}
.fdial:active{opacity:.92}
@media(max-width:860px){.chart-grid{grid-template-columns:1fr}}

/* ===== dark theme ===== */
html[data-theme=dark] .ws{--pri:#fafafa;--pri-soft:rgba(250,250,250,.1);--bd:#27272a;--mut:#a1a1aa;--mbg:#27272a;color:var(--fg)}
html[data-theme=dark] .ws.personal{--pri:#a78bfa;--pri-soft:rgba(167,139,250,.16)}
html[data-theme=dark] .ws input,html[data-theme=dark] .ws select,html[data-theme=dark] .ws textarea{background:var(--mbg)!important;color:var(--fg)!important;border-color:#3f3f46!important}
html[data-theme=dark] .ws input::placeholder,html[data-theme=dark] .ws textarea::placeholder{color:#71717a!important}
html[data-theme=dark] .chip.high,html[data-theme=dark] .chip.late{background:rgba(239,68,68,.16);color:#fca5a5}
html[data-theme=dark] .chip.medium{background:rgba(245,158,11,.16);color:#fcd34d}
html[data-theme=dark] .chip.low{background:rgba(34,197,94,.16);color:#86efac}
html[data-theme=dark] .chip.lab,html[data-theme=dark] .ev.lab{background:rgba(20,184,166,.16);color:#5eead4}
html[data-theme=dark] .chip{color:#d4d4d8}
html[data-theme=dark] .ws-err,html[data-theme=dark] .nag{background:#3b1414;border-color:#7f1d1d;color:#fca5a5}
html[data-theme=dark] .ws-btn.danger{border-color:#7f1d1d;color:#f87171}html[data-theme=dark] .ws-btn.danger:hover{background:#3b1414}
html[data-theme=dark] .toast{background:#fafafa;color:#18181b}
html[data-theme=dark] .dlg-bg{background:rgba(0,0,0,.7)}
/* the Charge Lab keeps its own light styling; in dark mode it is colour-inverted so it blends in */
html[data-theme=dark] .ws-main .min-h-screen{--pri:#18181b;--pri-soft:rgba(24,24,27,.07);--bd:#e4e4e7;--mut:#71717a;--mbg:#f4f4f5;--card:#fff;--sub:#fafafa;--fg:#09090b;--fg2:#52525b;--pri-fg:#fff;filter:invert(.91) hue-rotate(180deg)}
html[data-theme=dark] .ws-main .min-h-screen input,html[data-theme=dark] .ws-main .min-h-screen select,html[data-theme=dark] .ws-main .min-h-screen textarea{background:#fff!important;color:#09090b!important;border-color:#e4e4e7!important}
html[data-theme=dark] .ws-main .min-h-screen .ws-btn.danger{border-color:#fecaca;color:#dc2626}html[data-theme=dark] .ws-main .min-h-screen .ws-btn.danger:hover{background:#fef2f2}
.nag{background:#fef2f2;border-color:#fecaca}
/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.set-row:last-child{border:0}.set-row b{font:500 14px 'Inter'}.set-row p{margin:2px 0 0;font-size:12px;color:var(--mut);max-width:420px}
.set-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.set-ctl input{width:auto!important;min-width:120px!important;padding:8px 10px}
.set-card{margin-bottom:16px}.set-card>h4{margin:0 0 2px;font:600 15px 'Inter'}
/* task history, timeline, notes */
.th{border-top:1px solid var(--bd);margin:6px 0 14px;padding-top:14px}.th-title{font:600 14px 'Inter';margin-bottom:10px}
.th-el{display:flex;align-items:center;gap:10px;margin-bottom:12px}.th-el .ws-bar{flex:1}.th-el span{font:500 12px 'Inter';color:var(--mut);white-space:nowrap}
.th-drift{background:var(--sub);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px}.th-sub{font:500 12px 'Inter';color:var(--mut);margin-bottom:8px}
.th-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.th-pt{font:500 12px 'Inter';padding:3px 9px;border-radius:999px;background:var(--mbg)}.th-pt.now{background:var(--pri);color:var(--pri-fg)}
.th-arrow{font:600 11px 'Inter'}.th-arrow.late{color:#dc2626}.th-arrow.ok{color:#16a34a}
.th-add{display:flex;gap:8px;margin-bottom:14px}.th-add input{flex:1;padding:9px 11px}.th-add .ws-btn{min-height:38px}
.th-list{list-style:none;margin:0;padding:0 0 0 6px;position:relative;max-height:260px;overflow:auto}
.th-list li{display:flex;gap:12px;position:relative;padding-bottom:14px}
.th-list li:not(:last-child)::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:2px;background:var(--bd)}
.th-list li>i{width:12px;height:12px;border-radius:50%;flex:0 0 12px;margin-top:3px;box-shadow:0 0 0 3px var(--card);position:relative;z-index:1}
.th-t{font:400 13px/1.4 'Inter';white-space:pre-wrap;word-break:break-word}.th-d{font:11px 'Inter';color:var(--mut);margin-top:2px}
.tl-wrap{overflow-x:auto;padding:12px 16px}.tl{min-width:680px}
.tl-row{display:flex;align-items:center;gap:12px;min-height:42px;border-bottom:1px solid var(--bd);cursor:pointer}.tl-row:hover{background:var(--sub)}
.tl-row.axis{cursor:default;min-height:28px;border-bottom:1px solid var(--bd)}.tl-row.axis:hover{background:none}.tl-row.axis .tl-track{height:22px}
.tl-row.axis span{position:absolute;transform:translateX(-50%);font:11px 'Inter';color:var(--mut);white-space:nowrap}
.tl-name{flex:0 0 170px;font:500 13px 'Inter';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-name em{font-style:normal;color:#f59e0b;font-size:11px}
.tl-track{position:relative;flex:1;height:28px}
.tl-bar{position:absolute;top:5px;height:18px;border-radius:9px;background:var(--pri);opacity:.85;min-width:10px}

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

// ---------------------------------------------------------------------------

const ICONS = {

  alert: "m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z|M12 9v4|M12 17h.01",
  trash: "M3 6h18|M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6|M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
  tag: "M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59A2 2 0 0 0 3.59 11l9.59 9.59a2 2 0 0 0 2.82 0l4.59-4.59a2 2 0 0 0 0-2.82Z|M7.5 7.5h.01",
  search: "M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z|m21 21-4.35-4.35",
  loader: "M21 12a9 9 0 1 1-6.219-8.56",
  thermometer: "M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z",
  timer: "M10 2h4|M12 14 15 11|M12 14a8 8 0 1 1 0 16 8 8 0 0 1 0-16Z" // fallback, overridden below
};
// Timer needs a proper circle - fix definition
ICONS.timer = "M10 2h4|M12 14 15 11|M20 14a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z";

function Icon({ name, size = 16, className = "", spin = false }) {
  const def = ICONS[name];
  if (!def) return null;
  const parts = def.split("|");
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
         className={`${className} ${spin ? "animate-spin" : ""}`}>
      {parts.map((d, i) => <path key={i} d={d} />)}
    </svg>
  );
}

// ---------------------------------------------------------------------------
// Domain helpers
// ---------------------------------------------------------------------------
const seedData = () => ({
  models: [
    { id: "RF120", name: "Refrigerator 120L", category: "Refrigerator", pullDownReachingTimeMin: 90, thermoCutIn: 7, thermoCutOut: 2, thermoTolerance: 1.5 },
    { id: "RF250", name: "Refrigerator 250L", category: "Refrigerator", pullDownReachingTimeMin: 120, thermoCutIn: 6, thermoCutOut: 1.5, thermoTolerance: 1.5 },
    { id: "WD01", name: "Water Dispenser Std", category: "Water Dispenser", pullDownReachingTimeMin: 45, thermoCutIn: 10, thermoCutOut: 4, thermoTolerance: 1 },
  ],
  suppliers: [
    { id: "SUPA", name: "Supplier A Compressors Ltd" },
    { id: "SUPB", name: "Supplier B Motors Co" },
  ],
  compressors: [
    { id: "CMP0045", supplierId: "SUPA", spec: "R600a 1/6HP Rotary", type: "Fixed Speed", rpmMax: "", coolingCapacityW: 275, cop: 1.55, condensingTempC: 55, refrigerant: "R600a" },
    { id: "CMP0091", supplierId: "SUPB", spec: "R600a 1/6HP Reciprocating", type: "Fixed Speed", rpmMax: "", coolingCapacityW: 265, cop: 1.56, condensingTempC: 55, refrigerant: "R600a" },
  ],
  pairs: [
    {
      id: "RF120_SUPA_CMP0045", modelId: "RF120", supplierId: "SUPA", compressorId: "CMP0045",
      dateAdded: "2026-08-10",
      department: "Development",
      pullDownAttempts: [{ id: "a1", date: "2026-08-10", measured: 84, at3_5h: { Tf: -18.2, Tr: 3.1, suction: 34.5 }, at24h: { Tf: -20.1, Tr: 3.8, suction: 32.7 }, tester: "M. Tariq", notes: "" }],
      thermostatAttempts: [{ id: "a2", date: "2026-08-10", positions: { min: {cutIn:7.2,cutOut:2.1}, p3: {cutIn:6.8,cutOut:1.9}, p5: {cutIn:6.2,cutOut:1.5}, max: {cutIn:5.7,cutOut:1.1} }, tester: "M. Tariq", notes: "" }],
      qualityStatus: "Submitted to Quality", submittedDate: "2026-08-11", decisionDate: "", reviewer: "", comments: "",
    },
    {
      id: "RF120_SUPB_CMP0091", modelId: "RF120", supplierId: "SUPB", compressorId: "CMP0091",
      dateAdded: "2026-08-11",
      department: "Development",
      pullDownAttempts: [{ id: "a3", date: "2026-08-11", measured: 88, tester: "A. Raza", notes: "" }],
      thermostatAttempts: [{ id: "a4", date: "2026-08-11", cutIn: 9.8, cutOut: 4.6, tester: "A. Raza", notes: "Cut-out drifting high, charge likely over target" }],
      qualityStatus: "In Test", submittedDate: "", decisionDate: "", reviewer: "", comments: "",
    },
  ],
});

function uid(prefix) { return `${prefix}${Date.now().toString(36)}${Math.floor(Math.random() * 1000)}`; }

const REFRIGERATOR_THERMO_POSITION_DEFS = [
  ["min", "P# Min"],
  ["p3", "P# 3"],
  ["p5", "P# 5"],
  ["max", "P# Max"],
];

const DEEP_FREEZER_THERMO_POSITION_DEFS = [
  ["min", "P# Min"],
  ["mid", "P# Mid"],
  ["max", "P# Max"],
];

function getThermoPositionDefs(modelOrCategory) {
  const category = typeof modelOrCategory === "string"
    ? modelOrCategory
    : modelOrCategory?.category;
  return category === "Deep Freezer"
    ? DEEP_FREEZER_THERMO_POSITION_DEFS
    : REFRIGERATOR_THERMO_POSITION_DEFS;
}

function getThermoPositionRequirement(modelOrCategory) {
  const defs = getThermoPositionDefs(modelOrCategory);
  const category = typeof modelOrCategory === "string"
    ? modelOrCategory
    : modelOrCategory?.category;
  const categoryLabel = category || "this model";
  return `${defs.length} position${defs.length === 1 ? "" : "s"} × Ref + Freezer required`;
}

function hasThermoPositionTargets(model) {
  return !!model?.thermoPositions &&
    getThermoPositionDefs(model).every(([key]) => {
      const p = model.thermoPositions[key];
      return p && p.cutIn && p.cutOut &&
        p.cutIn.ref !== "" && p.cutIn.freezer !== "" &&
        p.cutOut.ref !== "" && p.cutOut.freezer !== "";
    });
}

function thermoTargetFor(model, key) {
  if (hasThermoPositionTargets(model)) return model.thermoPositions[key];
  // Legacy records: keep the old single-temperature target usable.
  if (key === "min" && model && model.thermoCutIn !== undefined) {
    return {
      cutIn: { ref: model.thermoCutIn, freezer: model.thermoCutIn },
      cutOut: { ref: model.thermoCutOut, freezer: model.thermoCutOut }
    };
  }
  return null;
}

function thermoPositionStatus(model, attempt, key) {
  const target = thermoTargetFor(model, key);
  const measured = attempt?.positions?.[key];
  if (!target || !measured) return null;
  const tol = Number(model.thermoTolerance);
  if (target.cutIn?.ref !== undefined) {
    // New records: separate Ref/Freezer values for Cut-In and Cut-Out.
    if (measured.cutIn?.ref !== undefined) {
      const vals = [measured.cutIn.ref, measured.cutIn.freezer, measured.cutOut?.ref, measured.cutOut?.freezer];
      if (vals.some(v => v === "" || v === null || v === undefined)) return null;
      return Math.abs(Number(measured.cutIn.ref)-Number(target.cutIn.ref)) <= tol &&
        Math.abs(Number(measured.cutIn.freezer)-Number(target.cutIn.freezer)) <= tol &&
        Math.abs(Number(measured.cutOut.ref)-Number(target.cutOut.ref)) <= tol &&
        Math.abs(Number(measured.cutOut.freezer)-Number(target.cutOut.freezer)) <= tol ? "Pass" : "Fail";
    }
    // Old records: compare their single temperature against the Ref target so existing data remains usable.
    if (measured.cutIn !== "" && measured.cutOut !== "") {
      return Math.abs(Number(measured.cutIn)-Number(target.cutIn.ref)) <= tol &&
        Math.abs(Number(measured.cutOut)-Number(target.cutOut.ref)) <= tol ? "Pass" : "Fail";
    }
  }
  return null;
}

function pullDownResult(model, measured) {
  if (!model || measured === "" || measured === null || measured === undefined) return null;
  const standardTime = Number(model.pullDownReachingTimeMin ?? model.pullDownTargetMin);
  return Number(measured) <= standardTime ? "Pass" : "Fail";
}
function thermostatResult(model, attempt) {
  if (!model || !attempt) return null;

  if (attempt.positions) {
    const pos = attempt.positions;
    const complete = getThermoPositionDefs(model).every(([k]) => {
      const p = pos[k];
      return p && p.cutIn && p.cutOut &&
        p.cutIn.ref !== "" && p.cutIn.freezer !== "" &&
        p.cutOut.ref !== "" && p.cutOut.freezer !== "";
    });
    if (complete && hasThermoPositionTargets(model)) {
      return getThermoPositionDefs(model).every(([key]) => thermoPositionStatus(model, attempt, key) === "Pass") ? "Pass" : "Fail";
    }
    // Backward compatibility for old thermostat logs.
    const legacyComplete = getThermoPositionDefs(model).every(([k]) => pos[k] && !pos[k].cutIn?.ref && pos[k].cutIn !== "" && pos[k].cutOut !== "");
    if (legacyComplete && model) {
      const targets = getThermoPositionDefs(model).map(([key]) => [key, thermoTargetFor(model, key)]);
      if (targets.every(([, target]) => target && target.cutIn?.ref !== undefined && target.cutOut?.ref !== undefined)) {
        return targets.every(([key, target]) => {
          const measured = pos[key];
          return Math.abs(Number(measured.cutIn)-Number(target.cutIn.ref)) <= Number(model.thermoTolerance) &&
                 Math.abs(Number(measured.cutOut)-Number(target.cutOut.ref)) <= Number(model.thermoTolerance);
        }) ? "Pass" : "Fail";
      }
    }
    return null;
  }

  // Backward compatibility for old thermostat records/models.
  if (attempt.cutIn === "" || attempt.cutOut === "" || attempt.cutIn === null || attempt.cutOut === null) return null;
  const minTarget = thermoTargetFor(model, "min");
  if (!minTarget) return null;
  const okIn = Math.abs(Number(attempt.cutIn) - Number(minTarget.cutIn?.ref ?? minTarget.cutIn)) <= Number(model.thermoTolerance);
  const okOut = Math.abs(Number(attempt.cutOut) - Number(minTarget.cutOut?.ref ?? minTarget.cutOut)) <= Number(model.thermoTolerance);
  return okIn && okOut ? "Pass" : "Fail";
}
function latestAttempt(list) { return (!list || list.length === 0) ? null : list[list.length - 1]; }
function overallOutcome(pair, model) {
  const pd = latestAttempt(pair.pullDownAttempts);
  const th = latestAttempt(pair.thermostatAttempts);
  const pdRes = pd ? pullDownResult(model, pd.measured) : null;
  const thRes = th ? thermostatResult(model, th) : null;
  if (!pdRes && !thRes) return "No tests yet";
  if (!pdRes || !thRes) return "Incomplete";
  if (pdRes === "Pass" && thRes === "Pass") return "All Passed";
  if (pdRes === "Fail" && thRes === "Fail") return "All Failed";
  return "Mixed";
}

const qStatusColor = {
  "Pending Test": "text-slate-300 bg-slate-800 border-slate-600",
  "In Test": "text-sky-300 bg-sky-950/40 border-sky-700",
  "Submitted to Quality": "text-amber-300 bg-amber-950/40 border-amber-700",
  "Approved": "text-emerald-300 bg-emerald-950/40 border-emerald-700",
  "Rejected": "text-rose-300 bg-rose-950/40 border-rose-700",
  "Rework Requested": "text-orange-300 bg-orange-950/40 border-orange-700",
};

// ---------------------------------------------------------------------------
// UI atoms
// ---------------------------------------------------------------------------
function Eyebrow({ children }) {
  return <div className="text-[11px] tracking-[0.18em] uppercase font-medium text-slate-400">{children}</div>;
}
function Readout({ value, className = "" }) {
  return <div className={`text-3xl font-semibold text-slate-50 ${className}`} style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{value}</div>;
}
function Kpi({ label, value, accent = "text-slate-900", onClick }) {
  const theme = {
    "Pairs Tracked": "kpi-blue",
    "Pull-Down Pass Rate": "kpi-teal",
    "Thermostat Pass Rate": "kpi-violet",
    "Awaiting Quality": "kpi-amber",
    "Approved": "kpi-green",
    "Rejected / Rework": "kpi-red"
  }[label] || "kpi-blue";
  return (
    <button type="button" onClick={onClick}
      className={`kpi-card ${theme} group w-full text-left border p-4 relative overflow-hidden shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-sky-300`}>
      <div className="kpi-card__glow" />

        <span className="kpi-card__label">{label}</span>
        <span className="kpi-card__arrow">↗</span>
      </div>
      <div className="kpi-card__value">{value}</div>
      <div className="kpi-card__action">View units <span>→</span></div>
    </button>
  );
}
function GaugeBadge({ status, label }) {
  const map = {
    Pass: { ring: "stroke-emerald-400", text: "text-emerald-300" },
    Fail: { ring: "stroke-rose-400", text: "text-rose-300" },
    null: { ring: "stroke-slate-600", text: "text-slate-500" },
  };
  const cfg = map[status] || map[null];
  return (
    <div className="flex items-center gap-1.5">
      <svg width="20" height="20" viewBox="0 0 20 20" className="shrink-0">
        <circle cx="10" cy="10" r="8" fill="none" strokeWidth="2" className="stroke-slate-800" />
        <circle cx="10" cy="10" r="8" fill="none" strokeWidth="2" strokeLinecap="round"
                className={cfg.ring} strokeDasharray={status ? "50.3 50.3" : "6 4"}
                transform="rotate(-90 10 10)" />
      </svg>
      <span className={`text-[11px] font-medium ${cfg.text}`}>{label}</span>
    </div>
  );
}
function Pill({ children, className }) {
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-sm border text-[11px] font-medium tracking-wide ${className}`}>{children}</span>;
}
function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-[11px] uppercase tracking-wider text-slate-400">{label}</span>
      {children}
    </label>
  );
}
const inputCls = "bg-slate-950 border border-slate-700 rounded-sm px-2.5 py-1.5 text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-teal-500 focus:border-teal-500 placeholder-slate-600";

function Btn({ children, onClick, variant = "primary", className = "", disabled }) {
  const base = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-sm text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-teal-600 hover:bg-teal-500 text-white",
    ghost: "bg-transparent hover:bg-slate-800 text-slate-300 border border-slate-700",
    danger: "bg-rose-900/40 hover:bg-rose-900/70 text-rose-300 border border-rose-800",
    subtle: "bg-slate-800 hover:bg-slate-700 text-slate-200",
  };
  return <button type="button" onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>{children}</button>;
}

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function LabApp({ data, persist, req }) {
  const [tab, setTab] = useState("dashboard");
  const [expandedPair, setExpandedPair] = useState(null);
  const [testingFilter, setTestingFilter] = useState("all");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const askDelete = useCallback((title, message, action) => { setDeleteConfirm({ title, message, action }); }, []);
  const cancelDelete = useCallback(() => setDeleteConfirm(null), []);
  const confirmDelete = useCallback(() => { if (!deleteConfirm) return; const action = deleteConfirm.action; setDeleteConfirm(null); action(); }, [deleteConfirm]);
  useEffect(() => { if (req) { if (req.pairId) setExpandedPair(req.pairId); setTab(req.tab || "testing"); } }, [req]);

  const modelsById = useMemo(() => Object.fromEntries((data?.models || []).map(m => [m.id, m])), [data]);
  const suppliersById = useMemo(() => Object.fromEntries((data?.suppliers || []).map(s => [s.id, s])), [data]);
  const compressorsById = useMemo(() => Object.fromEntries((data?.compressors || []).map(c => [c.id, c])), [data]);

  const pairsEnriched = useMemo(() => {
    if (!data) return [];
    return data.pairs.map(p => {
      const model = modelsById[p.modelId];
      const pd = latestAttempt(p.pullDownAttempts);
      const th = latestAttempt(p.thermostatAttempts);
      return {
        ...p, model, department: p.department || "Development",
        pullDownStatus: pd ? pullDownResult(model, pd.measured) : null,
        thermostatStatus: th ? thermostatResult(model, th) : null,
        outcome: overallOutcome(p, model),
      };
    });
  }, [data, modelsById]);

  const kpis = useMemo(() => {
    const total = pairsEnriched.length;
    const awaiting = pairsEnriched.filter(p => p.qualityStatus === "Submitted to Quality").length;
    const approved = pairsEnriched.filter(p => p.qualityStatus === "Approved").length;
    const rejected = pairsEnriched.filter(p => p.qualityStatus === "Rejected" || p.qualityStatus === "Rework Requested").length;
    const pdAttempts = pairsEnriched.flatMap(p => p.pullDownAttempts.map(a => pullDownResult(p.model, a.measured)));
    const thAttempts = pairsEnriched.flatMap(p => p.thermostatAttempts.map(a => thermostatResult(p.model, a)));
    const rate = (arr) => { const done = arr.filter(Boolean); return done.length === 0 ? "—" : Math.round((done.filter(r => r === "Pass").length / done.length) * 100) + "%"; };
    return { total, awaiting, approved, rejected, pdRate: rate(pdAttempts), thRate: rate(thAttempts) };
  }, [pairsEnriched]);

  const addPair = (pairId, modelId, supplierId, compressorId, department, note = "", targetDate = "", planningNote = "") => {
    const id = String(pairId || "").trim();
    if (!id) { alert("Pair ID is required."); return false; }
    if (data.pairs.some(p => p.id === id)) { alert("This Pair ID already exists. Please use a unique Pair ID."); return false; }
    persist({
      ...data,
      pairs: [...data.pairs, { id, modelId, supplierId, compressorId, department: department || "Development", note: note.trim(), targetDate: targetDate || null, dateAdded: new Date().toISOString().slice(0, 10),
        pullDownAttempts: [], thermostatAttempts: [], planningStatus: targetDate ? "Planned" : "Unplanned", planningNote: planningNote.trim(), completedAt: null, completedBy: null, qualityStatus: "Pending Test", submittedDate: "", decisionDate: "", reviewer: "", comments: "" }],
    });
    return true;
  };
  const addAttempt = (pairId, kind, attempt) => {
    persist({
      ...data,
      pairs: data.pairs.map(p => {
        if (p.id !== pairId) return p;
        const key = kind === "pulldown" ? "pullDownAttempts" : "thermostatAttempts";
        const wasEmpty = p.pullDownAttempts.length === 0 && p.thermostatAttempts.length === 0;
        const normalized = { ...attempt, loggedAt: attempt.loggedAt || new Date().toISOString() };
        return { ...p, [key]: [...(p[key] || []), normalized], qualityStatus: p.qualityStatus === "Pending Test" && wasEmpty ? "In Test" : p.qualityStatus };
      }),
    });
  };
  const updatePairStatus = (pairId, patch) => persist({ ...data, pairs: data.pairs.map(p => (p.id === pairId ? { ...p, ...patch } : p)) });
  const updateAttempt = (pairId, kind, attemptId, patch) => persist({ ...data, pairs: data.pairs.map(p => { if (p.id !== pairId) return p; const key = kind === "pulldown" ? "pullDownAttempts" : "thermostatAttempts"; return { ...p, [key]: (p[key] || []).map(a => a.id === attemptId ? { ...a, ...patch, editedAt: new Date().toISOString() } : a) }; }) });
  const deletePair = (pairId) => askDelete(
    "Remove Pair?",
    `Are you sure you want to remove pair “${pairId}”? This action cannot be undone.`,
    () => persist({ ...data, pairs: data.pairs.filter(p => p.id !== pairId) })
  );
  const addModel = (m) => persist({ ...data, models: [...data.models, m] });
  const updateModel = (modelId, patch) => persist({ ...data, models: data.models.map(m => m.id === modelId ? { ...m, ...patch, id: modelId } : m) });
  const addSupplier = (s) => persist({ ...data, suppliers: [...data.suppliers, s] });
  const updateSupplier = (supplierId, patch) => persist({ ...data, suppliers: data.suppliers.map(s => s.id === supplierId ? { ...s, ...patch, id: supplierId } : s) });
  const addCompressor = (c) => persist({ ...data, compressors: [...data.compressors, c] });
  const updateCompressor = (compressorId, patch) => persist({ ...data, compressors: data.compressors.map(c => c.id === compressorId ? { ...c, ...patch, id: compressorId } : c) });
  const deleteModel = (modelId) => {
    if (data.pairs.some(p => p.modelId === modelId)) { alert("This model is used by one or more pairs. Remove those pairs first."); return; }
    const model = data.models.find(m => m.id === modelId);
    askDelete(
      "Delete Model?",
      `Are you sure you want to delete “${model?.name || modelId}” from Master Data? This action cannot be undone.`,
      () => persist({ ...data, models: data.models.filter(m => m.id !== modelId) })
    );
  };
  const deleteSupplier = (supplierId) => {
    if (data.pairs.some(p => p.supplierId === supplierId) || data.compressors.some(c => c.supplierId === supplierId)) { alert("This supplier is used by a pair or compressor lot. Remove those dependencies first."); return; }
    const supplier = data.suppliers.find(x => x.id === supplierId);
    askDelete(
      "Delete Supplier?",
      `Are you sure you want to delete “${supplier?.name || supplierId}” from Master Data? This action cannot be undone.`,
      () => persist({ ...data, suppliers: data.suppliers.filter(x => x.id !== supplierId) })
    );
  };
  const deleteCompressor = (compressorId) => {
    if (data.pairs.some(p => p.compressorId === compressorId)) { alert("This compressor lot is used by one or more pairs. Remove those pairs first."); return; }
    const compressor = data.compressors.find(x => x.id === compressorId);
    askDelete(
      "Delete Compressor Lot?",
      `Are you sure you want to delete “${compressor?.id || compressorId}” from Master Data? This action cannot be undone.`,
      () => persist({ ...data, compressors: data.compressors.filter(x => x.id !== compressorId) })
    );
  };

  return (
    <div className="min-h-screen text-slate-200 p-4 md:p-8">
      <div className="max-w-7xl mx-auto">
        <div className="bg-slate-950 border border-slate-800 rounded-md overflow-hidden">
          <div className="bg-slate-900 border-b border-slate-800 px-5 py-4 flex items-center justify-between flex-wrap gap-3">
            <div>
              <div className="flex items-center gap-2">
                <Icon name="gauge" size={22} className="text-teal-400" />
                <h1 className="text-xl font-semibold tracking-wide text-slate-50" style={{ fontFamily: "Oswald", letterSpacing: "0.03em" }}>
                  CHARGE&nbsp;VERIFICATION&nbsp;LAB
                </h1>
              </div>
              <p className="text-xs text-slate-500 mt-0.5 ml-8">Pull-Down &amp; Thermostat qualification tracker · Refrigerators &amp; Water Dispensers</p>
            </div>
            <div className="app-nav-wrap">
              <button type="button" className="mobile-menu-btn" onClick={() => setMobileNavOpen(v => !v)}
                aria-label="Toggle navigation" aria-expanded={mobileNavOpen}>
                <span></span><span></span><span></span>
              </button>
              <nav className={`flex gap-1 bg-slate-950 border border-slate-800 rounded-sm p-1 app-nav ${mobileNavOpen ? "mobile-open" : ""}`}>
                {[["dashboard", "Dashboard"], ["testing", "Pairs & Testing"], ["planning", "Testing Planning"], ["quality", "Quality Approvals"], ["master", "Master Data"]].map(([key, label]) => (
                  <button key={key} onClick={() => { setTab(key); setMobileNavOpen(false); }}
                    className={`px-3 py-1.5 text-xs font-medium rounded-sm uppercase tracking-wide transition-colors ${tab === key ? "bg-teal-600 text-white" : "text-slate-400 hover:text-slate-200"}`}>
                    {label}
                  </button>
                ))}
              </nav>
            </div>
          </div>

          <div className="p-5">
            {tab === "dashboard" && <Dashboard kpis={kpis} pairsEnriched={pairsEnriched} data={data} persist={persist} setTab={setTab} setExpandedPair={setExpandedPair} onOpenTesting={(filter) => { setTestingFilter(filter); setTab("testing"); }} />}
            {tab === "testing" && (
              <Testing data={data} pairsEnriched={pairsEnriched} modelsById={modelsById} suppliersById={suppliersById}
                compressorsById={compressorsById} expandedPair={expandedPair} setExpandedPair={setExpandedPair}
                testingFilter={testingFilter} onClearTestingFilter={() => setTestingFilter("all")} addPair={addPair} addAttempt={addAttempt} deletePair={deletePair} updatePairStatus={updatePairStatus} updateAttempt={updateAttempt} />
            )}
            {tab === "planning" && <TestingPlanning data={data} pairsEnriched={pairsEnriched} setTab={setTab} setExpandedPair={setExpandedPair} persist={persist} />}
            {tab === "quality" && <Quality pairsEnriched={pairsEnriched} modelsById={modelsById} suppliersById={suppliersById} updatePairStatus={updatePairStatus} updateAttempt={updateAttempt} />}
            {tab === "master" && <MasterData data={data} addModel={addModel} updateModel={updateModel} addSupplier={addSupplier} updateSupplier={updateSupplier} addCompressor={addCompressor} updateCompressor={updateCompressor}
                deleteModel={deleteModel} deleteSupplier={deleteSupplier} deleteCompressor={deleteCompressor} />}
          </div>

          {deleteConfirm && (
            <div className="delete-confirm-backdrop" role="presentation" onMouseDown={e => { if (e.target === e.currentTarget) cancelDelete(); }}>
              <div className="delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
                <div className="delete-confirm-icon"><Icon name="trash" size={18} /></div>
                <div className="delete-confirm-content">
                  <div id="delete-confirm-title" className="delete-confirm-title">{deleteConfirm.title}</div>
                  <div className="delete-confirm-message">{deleteConfirm.message}</div>
                </div>
                <div className="delete-confirm-actions">
                  <button type="button" className="delete-confirm-no" onClick={cancelDelete}>No</button>
                  <button type="button" className="delete-confirm-yes" onClick={confirmDelete}>Yes, Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function getCurrentGasCharge(pair) {
  const attempts = [
    ...(pair.pullDownAttempts || []).map(a => ({ ...a, _type: "Pull-Down" })),
    ...(pair.thermostatAttempts || []).map(a => ({ ...a, _type: "Thermostat" }))
  ].filter(a => a.gasCharge !== undefined && a.gasCharge !== null && a.gasCharge !== "");
  if (!attempts.length) return null;
  attempts.sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  return attempts[attempts.length - 1].gasCharge;
}

function HomePlanningDashboard({ data, pairsEnriched, persist, onOpenPair }) {
  const today = new Date().toISOString().slice(0, 10);
  const [weekStart, setWeekStart] = useState(() => {
    const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0, 10);
  });
  const statuses = ["Unplanned", "Planned", "In Progress", "Completed", "Cancelled"];
  const statusOf = p => statuses.includes(p.planningStatus) ? p.planningStatus : (p.targetDate ? "Planned" : "Unplanned");
  const overdue = p => !!p.targetDate && p.targetDate < today && !["Completed", "Cancelled", "Unplanned"].includes(statusOf(p));
  const active = pairsEnriched.filter(p => !["Completed", "Cancelled"].includes(statusOf(p)));
  const cols = [
    ["Unplanned", active.filter(p => statusOf(p) === "Unplanned")],
    ["Planned", active.filter(p => statusOf(p) === "Planned" && !overdue(p))],
    ["In Progress", active.filter(p => statusOf(p) === "In Progress" && !overdue(p))],
    ["Overdue", active.filter(overdue)],
  ];
  const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const fmt = s => new Date(s + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const weekDays = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));

  const saveNote = (id, note) => persist({ ...data, pairs: data.pairs.map(p => p.id === id ? { ...p, planningNote: note } : p) });

  return (
    <div className="home-planning">
      <div className="home-planning-head">
        <div>
          <Eyebrow>Testing Schedule</Eyebrow>
          <div className="text-xs text-slate-500 mt-1">What's planned, what's overdue, and what's coming up next.</div>
        </div>
        <button type="button" className="home-planning-link" onClick={() => onOpenPair(null)}>Open full planning →</button>
      </div>

      <div className="home-kanban">
        {cols.map(([title, list]) => (
          <div className="home-kanban-col" key={title}>
            <div className="home-kanban-title">{title}<span>{list.length}</span></div>
            {list.length ? list.slice(0, 5).map(p => (
              <div className="home-plan-card" key={p.id}>
                <div onClick={() => onOpenPair(p.id)}>
                  <div className="home-plan-id">{p.id}</div>
                  <div className="home-plan-meta">{p.model?.name || p.modelId} · {p.department || "Development"}</div>
                  <div className="home-plan-date">{p.targetDate ? fmt(p.targetDate) : "No date"}</div>
                </div>
                <textarea
                  className="home-plan-note-input"
                  value={p.planningNote || ""}
                  onChange={e => saveNote(p.id, e.target.value)}
                  onClick={e => e.stopPropagation()}
                  placeholder="Note: what to do when the date arrives..."
                />
              </div>
            )) : <div className="home-plan-empty">Nothing here</div>}
            {list.length > 5 && <div className="text-[10px] text-slate-400 mt-2">+ {list.length - 5} more</div>}
          </div>
        ))}
      </div>

      <div className="home-calendar-wrap">
        <div className="home-calendar-head">
          <span>Upcoming testing dates</span>
          <div className="flex gap-1">
            <button type="button" onClick={() => setWeekStart(addDays(weekStart, -7))}>←</button>
            <button type="button" onClick={() => { const d = new Date(today + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); setWeekStart(d.toISOString().slice(0, 10)); }}>Today</button>
            <button type="button" onClick={() => setWeekStart(addDays(weekStart, 7))}>→</button>
          </div>
        </div>
        <div className="home-calendar">
          {weekDays.map(d => (
            <div className={`home-day ${d === today ? "is-today" : ""}`} key={d}>
              <div className="home-day-title">{fmt(d)}</div>
              {pairsEnriched.filter(p => p.targetDate === d && statusOf(p) !== "Cancelled").map(p => (
                <div className={`home-event ${overdue(p) ? "late" : ""}`} key={p.id} title={p.planningNote || p.note || ""} onClick={() => onOpenPair(p.id)}>
                  <b>{p.id}</b>
                  <span>{statusOf(p)}{overdue(p) ? " · LATE" : ""}</span>
                </div>
              ))}
              {!pairsEnriched.some(p => p.targetDate === d && statusOf(p) !== "Cancelled") && <div className="home-day-empty">—</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
